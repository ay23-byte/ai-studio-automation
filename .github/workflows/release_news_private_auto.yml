name: "Release daily news Short automatically (Private)"

# The render job has no YouTube credentials. This isolated workflow runs only
# after a successful trusted main-branch news build, and uploads only if the
# machine source/script/render gates all pass and YouTube confirms PRIVATE.
on:
  workflow_run:
    workflows: ["Daily news Short — build for review (PRIVATE release after approval)"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: auto-news-private-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Verify the exact trusted source build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_REF: main
        run: python scripts/verify_source_run.py --run-id "$SOURCE_RUN_ID" --mode daily_news --ref "$RELEASE_REF"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install FFmpeg and release dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
                 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends --fix-missing ffmpeg; then break; fi
              [[ "$attempt" -lt 3 ]] || { echo "::error::FFmpeg/FFprobe installation failed after 3 attempts."; exit 1; }
              sleep $((attempt * 10))
            done
          fi
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          python -m pip install --retries 5 --timeout 60 -r requirements-ci.txt

      - name: Download the exact build artifact, including its job database
        uses: actions/download-artifact@v8
        with:
          name: news-short-auto-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify the build database and release evidence exist
        run: |
          set -euo pipefail
          test -s db/studio.sqlite
          compgen -G "build/job_*/verification.json" >/dev/null || {
            echo "No publishable story was built in this run; nothing to upload."
            exit 0
          }
          compgen -G "output/daily_news/*.mp4" >/dev/null || compgen -G "output/*.mp4" >/dev/null

      - name: Run fail-closed QA and upload PRIVATE to Engineering Physics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_CHANNEL_HANDLE: ${{ vars.YT_CHANNEL_HANDLE || '@engineeringphysics-n5g' }}
          YT_CHANNEL_VERIFY: "1"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
          ALLOW_PUBLIC_PUBLISH: "0"
        run: python scripts/release_news_private_artifact.py

      - name: Preserve private-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-private-release-${{ github.run_id }}
          path: |
            build/job_*/automatic_private_release.json
          if-no-files-found: warn
          retention-days: 90

      - name: Alert on release failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "daily news private release"
