name: '⚙ Internal — First documentary production trial'

on:
  workflow_dispatch:
  push:
    branches:
      - production-trial/disappearing-villages
    paths:
      - ".github/production-trial-trigger.txt"

permissions:
  contents: read

concurrency:
  group: first-documentary-production-trial
  cancel-in-progress: false

jobs:
  build:
    name: Render first documentary (no YouTube upload)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -version
          ffprobe -version

      - name: Cache Chatterbox model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v3-${{ runner.os }}-production-trial-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source code
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py scripts

      - name: Install Playwright Chromium for 3D presenter recording
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install browser automation dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are not pinned here. Empty means the built-in chain in core/gemini.py;
          # set the repository variable to override without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_API_REFERER: ${{ vars.DVIDS_API_REFERER }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          FREE_ONLY_MODE: "1"
          AI_VIDEO_ENABLED: "0"
          TTS_ENGINE: "edge"
          ALLOW_CHATTERBOX_ON_CI: "false"
          TTS_VOICE: "en-IN-NeerjaNeural"
          CHATTERBOX_TORCH_THREADS: "2"
          PRESENTER_ENABLED: "1"
          PRESENTER_MODE: "talking_avatar_auto"
          PRESENTER_IMAGE: "assets/presenter/presenter_female.png"
          SADTALKER_DEVICE: "cpu"
          LONGFORM_VISUAL_MODE: "video_first"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "private"
          VISUAL_SEMANTIC_CHECK: "1"
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Missing GEMINI_API_KEY repository Actions secret. Add it under Settings > Secrets and variables > Actions." && exit 1)
          python run.py long "The Mystery of India's Disappearing Villages" --category india --minutes 12 --language english --voice-gender female

      - name: Verify generated MP4 files
        if: always()
        run: |
          find output -type f -name '*.mp4' -print 2>/dev/null || true
          find output -type f -name '*.mp4' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json "$file"
          done

      - name: Upload documentary and review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-documentary-production-trial
          path: |
            output/**/*.mp4
            output/*.mp4
            build/job_*/
          if-no-files-found: warn
          retention-days: 14
