name: "RETIRED: use 'Release approved documentary (Private)'"

# This workflow used to upload a documentary after a single "I reviewed it"
# tick box. It is retired: it holds no YouTube credentials and uploads nothing.
# Documentaries, Shorts and news Shorts are now released by one shared path that
# requires a decision on every shot, asset, claim and source, and binds the
# approval to the SHA-256 of the exact MP4:
#   .github/workflows/release_documentary_private.yml
# The file is kept (rather than deleted) so old links explain where to go.

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Retired, nothing is uploaded
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to the shared release workflow
        run: |
          echo "::error::This workflow is retired and uploads nothing. Use 'Release approved documentary (Private)' (release_documentary_private.yml) with the decisions exported from the review dashboard."
          {
            echo "## Retired"
            echo
            echo "Nothing was uploaded. Run **Release approved documentary (Private)** instead."
            echo "See docs/SHARED_REVIEW_PACKAGE.md for the review and release steps."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
