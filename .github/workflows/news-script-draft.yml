name: News script draft — human approval required

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: news-script-draft-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      ${{ github.event.issue.pull_request == null &&
          startsWith(github.event.issue.title, 'News story review:') &&
          github.event.issue.state == 'open' &&
          github.event.comment.body == '/approve-script' &&
          github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Extract the reviewed JSON packet from the issue
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body || "";
            const matches = [...body.matchAll(/```json\s*([\s\S]*?)```/gi)];
            if (matches.length !== 1) {
              core.setFailed("Issue must contain exactly one JSON packet in a fenced JSON block.");
              return;
            }
            let packet;
            try { packet = JSON.parse(matches[0][1]); }
            catch (error) { core.setFailed("The issue JSON packet is invalid: " + error.message); }
            const storyIdentity = [packet.story_title, packet.title, packet.story_id].filter(Boolean).join(" ");
            const defaultLanguage = /himalay/i.test(storyIdentity) ? "hindi" : "hinglish";
            const language = String(packet.language || defaultLanguage).toLowerCase();
            if (!["english", "hinglish", "hindi"].includes(language)) {
              core.setFailed("packet.language must be english, hinglish, or hindi.");
              return;
            }
            core.setOutput("language", language);
            if (packet.review_status !== "approved") {
              core.setFailed("Script drafting blocked: review_status must be approved after human source inspection.");
            }
            if (!Array.isArray(packet.sources) || !packet.sources.length ||
                !Array.isArray(packet.verified_facts) || !packet.verified_facts.length) {
              core.setFailed("Script drafting blocked: add inspected sources and verified_facts.");
            }
            require("fs").mkdirSync("output/daily_news", { recursive: true });
            require("fs").writeFileSync(
              "output/daily_news/reviewed_story.json",
              JSON.stringify(packet, null, 2) + "\n",
              "utf8"
            );

        id: packet

      - name: Install script-drafting dependency
        run: python -m pip install requests

      - name: Generate a script draft (source-verification gate runs first)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are not pinned here. Empty means the built-in chain in core/gemini.py;
          # set the repository variable to override without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          SCRIPT_LANGUAGE: ${{ steps.packet.outputs.language }}
        run: |
          python -m scripts.draft_reviewed_news_short \
            output/daily_news/reviewed_story.json \
            --output output/daily_news/shorts_script_draft.json \
            --language "$SCRIPT_LANGUAGE"

      - name: Upload script draft for human review
        id: draft-artifact
        uses: actions/upload-artifact@v7
        with:
          name: news-script-draft-issue-${{ github.event.issue.number }}
          path: |
            output/daily_news/reviewed_story.json
            output/daily_news/shorts_script_draft.json
          if-no-files-found: error
          retention-days: 14

      - name: Report draft artifact on the issue
        if: success()
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.draft-artifact.outputs.artifact-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "## Script draft generated",
                "",
                "The source-verification gate passed and a draft artifact is ready:",
                process.env.ARTIFACT_URL,
                "",
                "This is a draft only. Review every factual claim, attribution, duration, narration and caption. No video was rendered and nothing was uploaded or published.",
                "",
                "After reviewing the script artifact, comment exactly /approve-visuals to prepare visual candidates. Final MP4 rendering still requires a separate explicit workflow-dispatch confirmation."
              ].join("\n")
            });

      - name: Report a blocked or failed draft
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // Report the real reason (written by the drafting script) instead of
            // only pointing at the logs. The file never contains credentials.
            const fs = require("fs");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = ["## Script drafting was blocked or failed", ""];
            try {
              const report = JSON.parse(fs.readFileSync("output/daily_news/draft_failure.json", "utf8"));
              lines.push("**Reason:** `" + String(report.category) + "`", "");
              lines.push(String(report.reason || "").slice(0, 900), "");
              if (Array.isArray(report.attempted_models) && report.attempted_models.length) {
                lines.push("**Models tried:** " + report.attempted_models.join(", "), "");
              }
              lines.push("**What to do:** " + String(report.advice || ""), "");
            } catch (error) {
              lines.push("The packet was rejected before drafting started, or the run stopped unexpectedly.", "");
            }
            lines.push("Workflow run: " + runUrl, "");
            lines.push("Source-verification failures must be corrected with inspected, eligible evidence; do not bypass the gate. Nothing was rendered or uploaded.");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join("\n")
            });
