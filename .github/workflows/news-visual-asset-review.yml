name: News Short visual asset preparation — human review required

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: news-visual-assets-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{ github.event.issue.pull_request == null &&
          startsWith(github.event.issue.title, 'News story review:') &&
          github.event.issue.state == 'open' &&
          github.event.comment.body == 'Approve script for video production' &&
          github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Locate the latest successful script-draft artifact
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const candidates = comments
              .filter(c => c.user?.login === "github-actions[bot]" &&
                (c.body || "").includes("Script draft generated"))
              .map(c => ({ body: c.body || "", match: (c.body || "").match(/actions\/runs\/(\d+)\/artifacts\/\d+/) }))
              .filter(x => x.match)
              .reverse();
            let selected = null;
            for (const candidate of candidates) {
              const runId = Number(candidate.match[1]);
              const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              if (run.data.conclusion !== "success") continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: runId, per_page: 100
              });
              const expectedName = `news-script-draft-issue-${issueNumber}`;
              const artifact = artifacts.find(a => a.name === expectedName && !a.expired);
              if (artifact) { selected = { runId, artifactId: artifact.id }; break; }
            }
            if (!selected) {
              core.setFailed("No unexpired script-draft artifact from a successful run is available.");
              return;
            }
            core.setOutput("run_id", String(selected.runId));
            core.info(`Using script artifact from successful run ${selected.runId}.`);

      - name: Download reviewed script and evidence packet
        uses: actions/download-artifact@v4
        with:
          name: news-script-draft-issue-${{ github.event.issue.number }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Hindi fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install lightweight visual dependencies
        run: python -m pip install requests Pillow python-dotenv

      - name: Prepare visual candidates from the approved script
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m compileall -q core scripts/prepare_news_short_assets.py
          python -m unittest discover -s tests -p 'test_prepare_news_short_assets.py' -v
          python -m scripts.prepare_news_short_assets --artifact-dir source-artifact --output-dir output/daily_news/asset_review

      - name: Upload visual candidates and provenance for human review
        id: visual-artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-visual-review-issue-${{ github.event.issue.number }}
          path: |
            output/daily_news/asset_review/assets/*
            output/daily_news/asset_review/assets/*.source.json
            output/daily_news/asset_review/licenses.csv
            output/daily_news/asset_review/credits.txt
            output/daily_news/asset_review/production_candidate.json
            output/daily_news/asset_review/reviewed_evidence_packet.json
            output/daily_news/asset_review/asset_review_manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Report visual review package on the issue
        if: success()
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.visual-artifact.outputs.artifact-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "## News Short visual candidates ready for review",
                "",
                "Download the scene assets, production candidate, licence register and credits:",
                process.env.ARTIFACT_URL,
                "",
                "This stage prepared visuals only. It did not render the final MP4, upload, or publish.",
                "Inspect every image/clip for relevance, misleading context, watermarks, people/privacy, provenance, exact licence terms and attribution.",
                "AI-generated images are illustrative; provider terms must be checked separately. No asset or script has been auto-approved for rendering."
              ].join("\n")
            });

      - name: Report asset preparation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "News visual asset preparation failed or was blocked. Inspect this workflow run; no final video render or YouTube upload was attempted."
            });
