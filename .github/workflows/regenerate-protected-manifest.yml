name: Regenerate protected manifest
on:
  push:
    branches:
      - fix/documentary-visual-coverage-retries
      - fix/documentary-search-and-animations
      - fix/documentary-editorial-quality
      - fix/daily-news-review-first-release
      - feat/nvidia-model-integrations
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate manifest from this checkout
        run: python scripts/audit/generate_protected_manifest.py
      - name: Verify protected manifest tests
        run: python -m unittest discover -s tests -p 'test_protected_workflow_manifest.py' -v
      - name: Commit manifest if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audit/protected-workflow-manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest is already current.'
          else
            git commit -m 'Regenerate protected workflow manifest'
            git push
          fi
