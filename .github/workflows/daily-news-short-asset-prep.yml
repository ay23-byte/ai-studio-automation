name: Daily news Short — prepare visual review artifact

on:
  workflow_dispatch:
    inputs:
      script_run_id:
        description: "Run ID of the successful News script draft workflow that contains both reviewed JSON files"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-news-short-asset-prep
  cancel-in-progress: false

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install free CPU asset-preparation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests Pillow python-dotenv
      - name: Validate upstream workflow run ID
        env:
          SCRIPT_RUN_ID: ${{ inputs.script_run_id }}
        run: |
          if ! [[ "$SCRIPT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "script_run_id must be the numeric ID of a successful workflow run."
            exit 1
          fi
      - name: Download reviewed story and script draft artifact
        uses: actions/download-artifact@v4
        with:
          name: news-script-draft-${{ inputs.script_run_id }}
          run-id: ${{ inputs.script_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: input-news
      - name: Validate downloaded reviewed source inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("input-news")
          for name in ("reviewed_story.json", "shorts_script_draft.json"):
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Downloaded artifact is missing {name}.")
              json.loads(path.read_text(encoding="utf-8"))
          print("Both reviewed JSON files were downloaded and parse successfully.")
          PY
      - name: Prepare scene assets for human inspection
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          python scripts/prepare_news_short_assets.py \
            --artifact-dir input-news \
            --output-dir output/daily_news/asset_review
      - name: Validate prepared asset inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/daily_news/asset_review")
          candidate = json.loads((root / "production_candidate.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "asset_review_manifest.json").read_text(encoding="utf-8"))
          scenes = candidate.get("scenes", [])
          if not 4 <= len(scenes) <= 6 or len(manifest.get("assets", [])) != len(scenes):
              raise SystemExit("Prepared asset count does not match the 4–6 scene script.")
          for index, scene in enumerate(scenes, 1):
              asset = Path(scene["asset_path"])
              if not asset.is_file():
                  raise SystemExit(f"Prepared scene {index} asset is missing: {asset}")
              if not asset.with_suffix(asset.suffix + ".source.json").is_file():
                  raise SystemExit(f"Prepared scene {index} provenance sidecar is missing.")
          if manifest.get("final_mp4_rendered") or manifest.get("youtube_upload_performed") or manifest.get("publication_performed"):
              raise SystemExit("Asset-preparation stage must not render or publish.")
          print(f"Prepared {len(scenes)} scenes. Human visual/rights review is still required.")
          PY
      - name: Upload asset-review artifact for next workflow
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-assets-${{ github.run_id }}
          path: output/daily_news/asset_review/
          if-no-files-found: error
          retention-days: 14
