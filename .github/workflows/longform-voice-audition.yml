name: "Internal — Long-form narration voice audition"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt && python -m pip install chatterbox-tts
      - name: Generate relaxed long-form samples
        run: python scripts/create_longform_voice_audition.py
      - name: Upload audition samples
        uses: actions/upload-artifact@v7
        with:
          name: longform-voice-audition
          path: longform_voice_audition/**
          if-no-files-found: error
          retention-days: 14
