name: "V2 animation integration (opt-in validation)"

# Validation only: no schedules, production configuration, credentials or uploads.
on:
  workflow_dispatch:
    inputs:
      cosmos_smoke:
        description: "Run one NVIDIA Cosmos 3 Nano 480p text-to-video smoke test (uses NVIDIA hosted API)"
        required: true
        default: false
        type: boolean
      nemotron_smoke:
        description: "Run one small NVIDIA Nemotron API inference test using NVIDIA_API_KEY"
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/v2-animation-integration.yml'
      - 'src/production_v2/blender_orbit.py'
      - 'src/production_v2/manim_wave.py'
      - 'src/production_v2/visuals.py'
      - 'src/production_v2/editor.py'
      - 'src/production_v2/pipeline.py'
      - 'src/production_v2/script_engine.py'
      - 'src/production_v2/qa.py'
      - 'src/production_v2/config.py'
      - 'tests/test_v2_real_animation.py'
      - 'tests/test_v2_archive_animation.py'

permissions:
  contents: read

jobs:
  animation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install renderer system dependencies (bounded)
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the runner's existing package lists; bound every network operation.
          if ! timeout 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends \
              ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core libegl1 libgl1 libgl1-mesa-dri; then
            timeout 120s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            timeout 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends \
              ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core libegl1 libgl1 libgl1-mesa-dri
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Install Manim and test dependencies
        run: python -m pip install --retries 5 --timeout 60 'manim==0.19.0' 'bpy==4.2.23' 'pytest>=8,<10' 'Pillow>=10'
      - name: Run real Blender and Manim rendering tests
        env:
          PV2_TEST_REAL_ANIMATIONS: '1'
          PV2_BLENDER_BACKEND: bpy
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_v2_real_animation.py tests/test_v2_archive_animation.py -q > animation-test.log 2>&1
          result=$?
          cat animation-test.log
          if [ "$result" -ne 0 ]; then
            python - <<'PYCODE'
          from pathlib import Path
          text = Path('animation-test.log').read_text(errors='replace')[-10000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Animation test failure::' + text)
          PYCODE
          fi
          exit "$result"

  cosmos3-nano-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.cosmos_smoke == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cosmos credential is configured without printing it
        env:
          COSMOS_API_KEY: ${{ secrets[format('NVIDIA_{0}_API_KEY', 'COSMOS')] }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COSMOS_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret NVIDIA_COSMOS_API_KEY."
            exit 1
          fi
          echo "Cosmos credential is present (value is masked and never logged)."
      - name: Generate one short 480p Cosmos 3 Nano sample
        env:
          COSMOS_API_KEY: ${{ secrets[format('NVIDIA_{0}_API_KEY', 'COSMOS')] }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cosmos-smoke
          cat > artifacts/cosmos-smoke/request.json <<'JSON'
          {
            "model_mode": "text2video",
            "prompt": "Cinematic documentary establishing shot of the Himalayan foothills in northern India at dawn, realistic mountain landscape, soft morning mist drifting through a river valley, slow aerial camera movement, natural colors, no text, no logos.",
            "resolution": "480_16_9",
            "num_frames": 25,
            "num_inference_steps": 35,
            "guidance_scale": 6,
            "flow_shift": 10,
            "fps": 24,
            "seed": 42
          }
          JSON
          status=$(curl --silent --show-error --output artifacts/cosmos-smoke/response.json --write-out '%{http_code}' \
            --connect-timeout 30 --max-time 900 --retry 2 --retry-delay 5 \
            --request POST 'https://ai.api.nvidia.com/v1/cosmos/nvidia/cosmos3-nano' \
            --header "Authorization: Bearer ${COSMOS_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data-binary @artifacts/cosmos-smoke/request.json) || {
              echo "::error::Cosmos request failed at the transport layer. See sanitized curl diagnostics above."
              exit 1
            }
          echo "Cosmos HTTP status: ${status}"
          if [ "${status}" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/cosmos-smoke/response.json")
          raw = p.read_text(errors="replace")[:4000] if p.exists() else "(empty response)"
          try:
              obj = json.loads(raw)
              # Never print credential-like fields from a provider error payload.
              print(json.dumps(obj, indent=2)[:4000])
          except Exception:
              print(raw)
          PY
            if [ "${status}" = "404" ]; then
              echo "::error::NVIDIA returned HTTP 404 for its documented Cosmos route. This usually indicates endpoint/account availability or routing, not a malformed MP4."
            fi
            exit 1
          fi
          python - <<'PY'
          import base64, json
          from pathlib import Path
          response = json.loads(Path("artifacts/cosmos-smoke/response.json").read_text())
          encoded = response.get("b64_video")
          if not isinstance(encoded, str) or not encoded:
              raise SystemExit("NVIDIA returned HTTP 200 but no b64_video field.")
          video = base64.b64decode(encoded, validate=True)
          if len(video) < 1024:
              raise SystemExit(f"Decoded video is unexpectedly small: {len(video)} bytes.")
          Path("artifacts/cosmos-smoke/cosmos3-nano-smoke.mp4").write_bytes(video)
          print(f"Decoded MP4: {len(video)} bytes")
          PY
      - name: Validate generated MP4 container and stream
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -v error -show_entries format=format_name,duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json artifacts/cosmos-smoke/cosmos3-nano-smoke.mp4 | tee artifacts/cosmos-smoke/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/cosmos-smoke/ffprobe.json").read_text())
          streams = data.get("streams", [])
          if not any(s.get("codec_type") == "video" for s in streams):
              raise SystemExit("Decoded file has no video stream.")
          duration = float(data.get("format", {}).get("duration", 0))
          if duration <= 0:
              raise SystemExit("Generated MP4 has no positive duration.")
          print(f"MP4 validation passed; duration={duration:.3f}s")
          PY
      - name: Upload smoke-test evidence (never uploads to YouTube)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cosmos3-nano-smoke-${{ github.run_id }}
          path: artifacts/cosmos-smoke/
          if-no-files-found: warn
          retention-days: 7

  nemotron-api-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.nemotron_smoke == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify NVIDIA credential is configured without printing it
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret NVIDIA_API_KEY."
            exit 1
          fi
          echo "NVIDIA credential is present (value is never logged)."
      - name: Call Nemotron chat completions API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_LLM_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nemotron-smoke
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "model": os.environ["NVIDIA_MODEL"],
              "messages": [{"role": "user", "content": "Reply with exactly: NEMOTRON_API_OK"}],
              "max_tokens": 32,
              "temperature": 0
          }
          Path("artifacts/nemotron-smoke/request.json").write_text(json.dumps(payload))
          PY
          status=$(curl --silent --show-error --output artifacts/nemotron-smoke/response.json --write-out '%{http_code}' \\
            --connect-timeout 30 --max-time 120 --retry 1 --retry-delay 3 \\
            --request POST 'https://integrate.api.nvidia.com/v1/chat/completions' \\
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \\
            --header 'Content-Type: application/json' \\
            --data-binary @artifacts/nemotron-smoke/request.json)
          echo "Nemotron HTTP status: ${status}"
          if [ "${status}" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              obj = json.loads(Path("artifacts/nemotron-smoke/response.json").read_text())
              err = obj.get("error", {})
              if isinstance(err, dict):
                  print("Provider error type:", err.get("type", "unspecified"))
                  print("Provider error code:", err.get("code", "unspecified"))
              else:
                  print("Provider returned a nonstandard error response.")
          except Exception:
              print("Provider returned a non-JSON error response.")
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/nemotron-smoke/response.json").read_text())
          choices = data.get("choices") or []
          content = ((choices[0].get("message") or {}).get("content") if choices else None)
          if not isinstance(content, str) or not content.strip():
              raise SystemExit("HTTP 200 but no assistant message was returned.")
          report = {"status": "passed", "model": data.get("model"), "choices": len(choices), "response_nonempty": True}
          Path("artifacts/nemotron-smoke/result.json").write_text(json.dumps(report, indent=2))
          print("Nemotron API authentication and inference passed.")
          print("Returned model:", data.get("model"))
          PY
      - name: Upload sanitized Nemotron test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nemotron-api-smoke-${{ github.run_id }}
          path: artifacts/nemotron-smoke/
          if-no-files-found: warn
          retention-days: 7

