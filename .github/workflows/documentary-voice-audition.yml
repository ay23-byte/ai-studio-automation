name: '⚙ Internal — Documentary narration voice audition'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test narration voice selection
        run: python -m unittest discover -s tests -p 'test_voice_selection.py' -v
      - name: Generate three comparable narration samples
        run: python -m scripts.create_voice_audition
      - name: Upload audition tracks and synthesis reports
        uses: actions/upload-artifact@v7
        with:
          name: documentary-voice-audition
          path: voice_audition/**
          if-no-files-found: error
          retention-days: 14
