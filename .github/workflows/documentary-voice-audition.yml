name: '⚙ Internal — Daily News voice audition'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal pipeline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Install optional Chatterbox engine
        run: python -m pip install chatterbox-tts
      - name: Generate same-script Daily News Edge and Chatterbox samples
        run: python -m scripts.create_daily_news_voice_audition
      - name: Upload Daily News audition tracks and reports
        uses: actions/upload-artifact@v7
        with:
          name: daily-news-voice-audition
          path: daily_news_voice_audition/**
          if-no-files-found: error
          retention-days: 14
