name: '⚙ Internal — Kaggle Wan2.1 free GPU video worker'

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Cinematic scene prompt
        required: false
        type: string
      scene_manifest:
        description: Optional JSON array of up to four scenes with id, title, and prompt
        required: false
        type: string
      size:
        description: Output orientation and resolution
        required: true
        type: choice
        options: ["480*832", "832*480"]
        default: "480*832"
      frame_num:
        description: Frame count (must be 4n+1)
        required: true
        type: choice
        options: ["9", "17", "33"]
        default: "9"
      sample_steps:
        description: Denoising steps
        required: true
        type: choice
        options: ["8", "12"]
        default: "8"

permissions:
  contents: read

concurrency:
  group: kaggle-wan-worker
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install and verify Kaggle CLI dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          # Install six explicitly: some Kaggle CLI dependency resolutions have
          # left this runtime dependency absent even after installing kaggle.
          python -m pip install --no-cache-dir --upgrade six
          python -m pip install --no-cache-dir --upgrade kaggle
          python -m pip check
          python - <<'PY'
          import sys
          import six
          import kaggle
          from kaggle.api.kaggle_api_extended import KaggleApi
          print("Python:", sys.executable)
          print("six:", six.__version__)
          print("Kaggle CLI package:", getattr(kaggle, "__version__", "installed"))
          print("KaggleApi import: OK")
          PY
          kaggle --version

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::Add KAGGLE_USERNAME as a repository Actions secret; it is needed to identify your kernel."
            exit 1
          fi
          if [ -z "$KAGGLE_API_TOKEN" ] && [ -z "$KAGGLE_KEY" ]; then
            echo "::error::Add either KAGGLE_API_TOKEN (recommended, from Kaggle Settings > API) or legacy KAGGLE_KEY as a repository Actions secret."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          CREDENTIAL_VALUE="$KAGGLE_API_TOKEN"
          CREDENTIAL_SOURCE="KAGGLE_API_TOKEN"
          if [ -z "$CREDENTIAL_VALUE" ]; then
            CREDENTIAL_VALUE="$KAGGLE_KEY"
            CREDENTIAL_SOURCE="KAGGLE_KEY"
          fi
          # Kaggle's newer personal API tokens use the KGAT_ prefix. Accept
          # them under either secret name; otherwise retain legacy kaggle.json.
          if [[ "$CREDENTIAL_VALUE" == KGAT_* ]]; then
            printf '%s' "$CREDENTIAL_VALUE" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
            echo "Configured Kaggle using an API access token from $CREDENTIAL_SOURCE."
          else
            KAGGLE_KEY="$CREDENTIAL_VALUE" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path.home() / ".kaggle" / "kaggle.json"
          path.write_text(json.dumps({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]}), encoding="utf-8")
          path.chmod(0o600)
          PY
            echo "Configured Kaggle using legacy username/key credentials from $CREDENTIAL_SOURCE."
          fi

      - name: Validate inputs and prepare private Kaggle kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
          WAN_PROMPT: ${{ inputs.prompt }}
          WAN_SCENE_MANIFEST: ${{ inputs.scene_manifest }}
          WAN_SIZE: ${{ inputs.size }}
          WAN_FRAME_NUM: ${{ inputs.frame_num }}
          WAN_SAMPLE_STEPS: ${{ inputs.sample_steps }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_KERNEL_SLUG" ]; then
            echo "::error::Add Actions variable KAGGLE_KERNEL_SLUG (slug only, e.g. wan21-free-worker)."
            exit 1
          fi
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          root = Path("kaggle/wan_worker")
          notebook_path = root / "wan_worker.ipynb"
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          prompt = os.environ["WAN_PROMPT"].strip()
          raw_scenes = os.environ.get("WAN_SCENE_MANIFEST", "").strip()
          if raw_scenes:
              try:
                  scenes = json.loads(raw_scenes)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"scene_manifest must be valid JSON: {exc}")
              if not isinstance(scenes, list) or not 1 <= len(scenes) <= 4:
                  raise SystemExit("scene_manifest must be a JSON array containing 1-4 scenes.")
              normalized = []
              for index, scene in enumerate(scenes, start=1):
                  if not isinstance(scene, dict) or not str(scene.get("prompt", "")).strip():
                      raise SystemExit(f"Scene {index} must be an object with a non-empty prompt.")
                  scene_id = str(scene.get("id", f"scene_{index:02d}")).strip()
                  if not scene_id or len(scene_id) > 64:
                      raise SystemExit(f"Scene {index} has an invalid id.")
                  normalized.append({"id": scene_id, "title": str(scene.get("title", scene_id))[:120], "prompt": str(scene["prompt"]).strip()})
          elif prompt:
              normalized = [{"id": "scene_01", "title": "Single prompt scene", "prompt": prompt}]
          else:
              raise SystemExit("Provide either prompt or scene_manifest.")
          size = os.environ["WAN_SIZE"]
          frames = int(os.environ["WAN_FRAME_NUM"])
          steps = int(os.environ["WAN_SAMPLE_STEPS"])
          if size not in {"480*832", "832*480"}:
              raise SystemExit(f"Unsupported size: {size}")
          if frames not in {9, 17, 33} or (frames - 1) % 4:
              raise SystemExit(f"Invalid frame count: {frames}")
          if steps not in {8, 12}:
              raise SystemExit(f"Invalid sampling steps: {steps}")
          manifest = {"scenes": normalized, "size": size, "frame_num": frames, "sample_steps": steps}
          encoded = base64.b64encode(json.dumps(manifest).encode("utf-8")).decode("ascii")
          replaced = False
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  if "__JOB_MANIFEST_B64__" in source:
                      cell["source"] = source.replace("__JOB_MANIFEST_B64__", encoded).splitlines(keepends=True)
                      replaced = True
          if not replaced:
              raise SystemExit("Notebook manifest placeholder was not found.")
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), f"wan_worker_cell_{index}", "exec")
          notebook_path.write_text(json.dumps(notebook, ensure_ascii=False), encoding="utf-8")
          metadata = {
              "id": f'{os.environ["KAGGLE_USERNAME"]}/{os.environ["KAGGLE_KERNEL_SLUG"]}',
              "title": "kagglefreegpu",
              "code_file": "wan_worker.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
          }
          (root / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("Prepared private Kaggle kernel metadata for", metadata["id"])
          PY

      - name: Submit Wan2.1 job to Kaggle GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
        run: |
          set -euo pipefail
          KERNEL_ID="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          echo "Submitting Kaggle kernel: $KERNEL_ID"
          kaggle kernels push -p kaggle/wan_worker
          echo "KERNEL_ID=$KERNEL_ID" >> "$GITHUB_ENV"

      - name: Wait for Kaggle GPU generation
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
        run: |
          set -euo pipefail
          KERNEL_ID="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          for attempt in $(seq 1 180); do
            STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1)" || {
              echo "$STATUS"
              echo "::error::Unable to retrieve Kaggle kernel status."
              exit 1
            }
            echo "Kaggle status check $attempt/180:"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eqi 'COMPLETE'; then exit 0; fi
            if echo "$STATUS" | grep -Eqi 'ERROR|FAILED|CANCELLED|CANCELED'; then
              echo "::error::Kaggle kernel reported a failed or cancelled state."
              exit 1
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for Kaggle after 180 minutes."
          exit 1

      - name: Install FFmpeg tools for MP4 validation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1

      - name: Download and validate generated MP4
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
        run: |
          set -euo pipefail
          mkdir -p output/wan
          kaggle kernels output "$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG" -p output/wan
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          files = [p for p in Path("output/wan").rglob("*") if p.is_file() and p.suffix.lower() == ".mp4" and p.stat().st_size > 50_000]
          if not files:
              raise SystemExit("Kaggle returned no MP4 larger than 50 KB.")
          ffprobe = shutil.which("ffprobe")
          if not ffprobe:
              raise SystemExit("ffprobe is unavailable on the GitHub runner.")
          reports = []
          for path in files:
              result = subprocess.run([ffprobe, "-v", "error", "-show_entries", "format=duration:stream=codec_type,width,height", "-of", "json", str(path)], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f"ffprobe rejected {path.name}: {result.stderr[-1000:]}")
              data = json.loads(result.stdout)
              video = next((s for s in data.get("streams", []) if s.get("codec_type") == "video"), None)
              duration = float((data.get("format") or {}).get("duration") or 0)
              if not video or duration <= 0:
                  raise SystemExit(f"Invalid video stream or duration: {path.name}")
              reports.append({"file": str(path), "bytes": path.stat().st_size, "duration_seconds": duration, "width": video.get("width"), "height": video.get("height")})
          Path("output/wan/validation.json").write_text(json.dumps(reports, indent=2), encoding="utf-8")
          print(json.dumps(reports, indent=2))
          PY

      - name: Upload generated clips and validation report
        uses: actions/upload-artifact@v7
        with:
          name: wan21-generated-clips
          path: output/wan/
          if-no-files-found: error
          retention-days: 14
