name: Daily news Shorts — research queue
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 13 * * *'  # 19:00 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-news-shorts-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system font dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
      - name: Install discovery and visual-asset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
          python -m pip check
      - name: Collect public RSS metadata
        run: python -m scripts.collect_daily_news
      - name: Compile news pipeline modules
        run: python -m compileall -q core scripts
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -p 'test_*news*.py' -v
      - name: Upload candidate queue for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-candidates-${{ github.run_id }}
          path: output/daily_news/
          if-no-files-found: error
          retention-days: 14
