name: Daily news Shorts — research queue
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 13 * * *'  # 19:00 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-news-shorts-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system font dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
      # Deliberately minimal: RSS discovery needs only requests and Pillow.
      # Narration providers (edge-tts) and the YouTube client are NOT installed
      # here; core modules must import without them (see core/voice.py and the
      # news-collect-minimal-env job in validate.yml, which guards this on PRs).
      - name: Install discovery and visual-asset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
          python -m pip check
      - name: Collect public RSS metadata
        run: python -m scripts.collect_daily_news
      - name: Compile news pipeline modules
        run: python -m compileall -q core scripts
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -p 'test_*news*.py' -v
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          lines = ["## Daily news research queue", ""]
          path = pathlib.Path("output/daily_news/latest_candidates.json")
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              errors = data.get("feed_errors") or []
              lines += [
                  f"- **Collection:** completed at {data.get('collected_at', 'unknown')}",
                  f"- **Candidate headlines:** {data.get('candidate_count', 0)}",
                  f"- **Ranked story clusters:** {len(data.get('ranked_story_clusters') or [])}",
                  f"- **Feeds that failed:** {len(errors)}",
                  f"- **Editorial status:** {data.get('editorial_status', 'unknown')}",
              ]
          else:
              lines.append("- **Collection:** FAILED (no candidate file was written)")
          lines += [
              f"- **Job status:** {os.environ.get('JOB_STATUS', 'unknown')}",
              "- **Upload status:** not applicable (this workflow never renders or uploads)",
              "",
              "Candidate headlines are discovery metadata only; nothing here is a verified story.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Upload candidate queue for editorial review
        uses: actions/upload-artifact@v7
        with:
          name: daily-news-candidates-${{ github.run_id }}
          path: output/daily_news/
          if-no-files-found: error
          retention-days: 14
