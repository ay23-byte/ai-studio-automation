name: "Release scheduled general Short (Private)"
on:
  workflow_run:
    workflows: ["1. Daily general Shorts — build and package"]
    types: [completed]

permissions:
  actions: read
  contents: write

# The build and release are separate jobs. This workflow is the only standard-Short
# path with YouTube credentials, and it runs only after a successful scheduled build.
concurrency:
  group: auto-short-private-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Download the exact successful scheduled build artifact
        uses: actions/download-artifact@v8
        with:
          name: shorts-review-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify the artifact is complete before release
        run: |
          set -euo pipefail
          test -s db/studio.sqlite
          compgen -G "build/job_*/quality_report.json" >/dev/null
          compgen -G "output/shorts_*.mp4" >/dev/null
          echo "Exact scheduled build artifact is present."

      - name: Restore persistent duplicate ledger
        run: python scripts/persist_state.py restore

      - name: Run strict machine QA and upload PRIVATE to Engineering Physics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_CHANNEL_HANDLE: ${{ vars.YT_CHANNEL_HANDLE || '@engineeringphysics-n5g' }}
          YT_CHANNEL_VERIFY: "1"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
          ALLOW_PUBLIC_PUBLISH: "0"
          REQUIRE_ASSET_PROVENANCE: "1"
        run: python run_daily.py --format shorts --upload-latest --auto-private-release

      - name: Persist duplicate ledger and upload state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "private Shorts release for build ${{ github.event.workflow_run.id }}"

      - name: Preserve private-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shorts-private-release-${{ github.run_id }}
          path: |
            build/job_*/release_gate.json
            build/job_*/upload_metadata.json
            build/job_*/upload_result.json
            db/studio.sqlite
            state/
          if-no-files-found: warn
          retention-days: 90

      - name: Write release summary
        if: always()
        run: |
          echo "## Scheduled general Short private release" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "build/job_*/upload_result.json" >/dev/null; then
            cat build/job_*/upload_result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verified upload result was produced. Check the release gate and job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "scheduled general Short private release"
