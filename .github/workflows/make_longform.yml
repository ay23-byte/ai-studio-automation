name: '2. Create and upload a Documentary — automatic'
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
      category:
        description: "Category (auto detects from any topic, or enter your own)"
        type: string
        required: false
        default: auto
      semantic_review:
        description: "Use Gemini vision to screen sampled shots against narration (extra model usage)"
        type: boolean
        required: true
        default: false
      minutes:
        description: "Target length in minutes"
        type: choice
        options: ["10", "12", "15"]
        default: "12"
      language:
        description: "Narration and subtitle language"
        type: choice
        options: [hinglish, hindi, english]
        default: hinglish
      voice_gender:
        description: "Narration voice and matching presenter portrait"
        type: choice
        options: [male, female]
        default: male
      presenter_mode:
        description: "Presenter animation (auto 3D avatar records each chapter from its narration)"
        type: choice
        options: [talking_avatar_auto, talking_avatar, sadtalker, still_cpu, off]
        default: talking_avatar_auto
      visual_mode:
        description: "Long-form B-roll source preference"
        type: choice
        options: [video_first, image_first]
        default: video_first

permissions:
  contents: read

# One run of this mode at a time. Each mode has its own queue, so a long
# documentary build cannot hold back (or displace) the daily Shorts and news runs.
concurrency:
  group: studio-build-longform
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Preflight documentary providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          if not os.getenv("GEMINI_API_KEY"):
              print("FATAL: GEMINI_API_KEY is missing; script generation cannot start.")
              sys.exit(1)
          providers = {
              "Pixabay": bool(os.getenv("PIXABAY_API_KEY")),
              "Cloudflare image generation": bool(os.getenv("CLOUDFLARE_ACCOUNT_ID") and os.getenv("CLOUDFLARE_API_TOKEN")),
              "Coverr": bool(os.getenv("COVERR_API_KEY")),
              "DVIDS": bool(os.getenv("DVIDS_API_KEY")),
              "NARA": bool(os.getenv("NARA_API_KEY")),
              "Europeana": bool(os.getenv("EUROPEANA_API_KEY")),
              "Pollinations (keyless fallback)": True,
              "Wikimedia Commons (public API)": True,
              "Internet Archive (public metadata)": True,
          }
          for name, configured in providers.items():
              print(f"Provider {'READY' if configured else 'NOT CONFIGURED'}: {name}")
          if not any(providers[name] for name in ("Pixabay", "Cloudflare image generation", "Coverr")):
              print("WARNING: No keyed general visual provider is configured; archival/context graphics and keyless fallback may be needed.")
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng

      # This workflow runs on GitHub-hosted CPU runners. Chatterbox v3
      # inference is too slow there for dependable long-form production.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Python for SadTalker CPU inference
        if: ${{ inputs.presenter_mode == 'sadtalker' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Install SadTalker and pretrained models (CPU)
        if: ${{ inputs.presenter_mode == 'sadtalker' }}
        env:
          SADTALKER_DIR: ${{ runner.temp }}/SadTalker
          SADTALKER_VENV: ${{ runner.temp }}/sadtalker-venv
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git "$SADTALKER_DIR"
          python -m venv "$SADTALKER_VENV"
          "$SADTALKER_VENV/bin/python" -m pip install --upgrade pip setuptools wheel
          "$SADTALKER_VENV/bin/python" -m pip install torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          "$SADTALKER_VENV/bin/python" -m pip install -r "$SADTALKER_DIR/requirements.txt"
          # The upstream download script writes to ./checkpoints relative to
          # the current directory. Run it from SadTalker itself so inference.py
          # can find checkpoints/ and the downloaded safetensors weights.
          cd "$SADTALKER_DIR"
          bash scripts/download_models.sh
          test -s checkpoints/SadTalker_V0.0.2_256.safetensors
          test -s checkpoints/mapping_00229-model.pth.tar

      - name: Restore project Python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py

      - name: Test narration provider fallback and long-form package adapter
        run: python -m unittest tests.test_voice_fallback tests.test_voice_text tests.test_voice_pacing tests.test_longform_review_package tests.test_upload_documentary_artifact -v

      - name: Install Playwright Chromium for automatic 3D avatar recording
        if: ${{ inputs.presenter_mode == 'talking_avatar_auto' }}
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install browser automation dependencies
        if: ${{ inputs.presenter_mode == 'talking_avatar_auto' }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build long-form video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are not pinned here. Empty means the built-in chain in core/gemini.py;
          # set the repository variable to override without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL_LONGFORM }}
          GEMINI_PROFILE: longform
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS_LONGFORM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          # Hard-disable every hosted AI-video provider in the GitHub-only,
          # zero-paid documentary workflow. Open-weight video models still need
          # GPU compute; standard GitHub-hosted runners are CPU-only.
          FREE_ONLY_MODE: "1"
          AI_VIDEO_ENABLED: "0"
          AI_VIDEO_PROVIDER: "disabled"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_ENGINE: "edge"
          ALLOW_CHATTERBOX_ON_CI: "false"
          CHATTERBOX_TORCH_THREADS: "2"
          PRESENTER_ENABLED: ${{ inputs.presenter_mode == 'off' && '0' || '1' }}
          PRESENTER_MODE: ${{ inputs.presenter_mode }}
          LONGFORM_VISUAL_MODE: ${{ inputs.visual_mode }}
          SADTALKER_DIR: ${{ runner.temp }}/SadTalker
          SADTALKER_PYTHON: ${{ runner.temp }}/sadtalker-venv/bin/python
          SADTALKER_DEVICE: cpu
          PRESENTER_IMAGE: ${{ inputs.voice_gender == 'female' && 'assets/presenter/presenter_female.png' || 'assets/presenter/presenter_master.png' }}
          CHANNEL_NAME: "Engineering Physics"
          LONGFORM_LANGUAGE: ${{ inputs.language || 'hinglish' }}
          VISUAL_SEMANTIC_CHECK: ${{ inputs.semantic_review && '1' || '0' }}
          VISUAL_SEMANTIC_MAX_SHOTS: "40"
          # Inputs are passed through the environment, never interpolated into
          # the shell script, so a topic containing quotes or $(...) cannot run code.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_MINUTES: ${{ inputs.minutes }}
          INPUT_LANGUAGE: ${{ inputs.language || 'hinglish' }}
          INPUT_VOICE_GENDER: ${{ inputs.voice_gender }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_MINUTES" =~ ^1[0-5]$ ]] || { echo "::error::minutes must be between 10 and 15."; exit 1; }
          python run.py long "$INPUT_TOPIC" \
            --category "$INPUT_CATEGORY" \
            --minutes "$INPUT_MINUTES" \
            --language "$INPUT_LANGUAGE" \
            --voice-gender "$INPUT_VOICE_GENDER" \
            --force

      # Review-only: assembles the shared package (manifest, research ledger, QA,
      # dashboard). Fails the run when the documentary cannot be approved, so a
      # green run always means "ready for a human". The artifact is uploaded either way.
      - name: Assemble the review package (no upload)
        if: success()
        run: python scripts/package_build_for_review.py --mode longform

      - name: Mark build as review-only (upload is a separate approved workflow)
        if: always()
        run: |
          echo "This workflow only builds and packages a review artifact."
          echo "No YouTube upload is attempted here."
          echo "Use the separate 'Release approved documentary (Private)' workflow after human review."

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: "false"
        run: |
          python scripts/write_job_summary.py --pipeline longform \
            --artifact "longform-review-${GITHUB_RUN_ID}" \
            --upload-result youtube-upload-result.json \
            --upload-failure youtube-upload-failure.json

      # Preserve the complete reviewable build, not only the MP4. GitHub-hosted
      # runners are ephemeral, so the visual/source/rights/audio/research decisions
      # and sampled frames must be downloadable after a blocked upload.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: longform-review-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            build/job_*/
            youtube-upload-result.json
            youtube-upload-failure.json
          if-no-files-found: error
          retention-days: 14

      # Build state remains an Actions artifact/local runtime concern; never
      # commit a live SQLite database or grant this render workflow write access.

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "make-longform"
