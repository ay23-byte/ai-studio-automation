name: '2. Build a Documentary — automatic PRIVATE release'
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
      category:
        description: "Category (auto detects from any topic, or enter your own)"
        type: string
        required: false
        default: auto
      semantic_review:
        description: "Use Gemini vision to screen sampled shots against narration (extra model usage)"
        type: boolean
        required: true
        default: true
      minutes:
        description: "Target length in minutes"
        type: choice
        options: ["18", "20", "22", "25", "28", "30"]
        default: "22"
      language:
        description: "Narration language (subtitles are always English)"
        type: choice
        options: [hinglish, hindi, english]
        default: hinglish
      channel_profile:
        description: "Editorial profile for this build"
        type: choice
        options: [beyond_science, standard]
        default: beyond_science
      voice_gender:
        description: "Narration voice and matching presenter portrait"
        type: choice
        options: [male, female]
        default: male
      presenter_mode:
        description: "Presenter animation (auto 3D avatar renders each chapter opening from its narration)"
        type: choice
        options: [talking_avatar_auto, talking_avatar, sadtalker, still_cpu, off]
        default: talking_avatar_auto
      visual_mode:
        description: "Long-form B-roll source preference"
        type: choice
        options: [video_first, image_first]
        default: video_first
  schedule:
    - cron: "0 13 * * 0"  # Every Sunday at 18:30 IST; topic is selected automatically.
  # Production test from a pull request: only when the request file is part of the pull
  # request AND the newest commit message contains [documentary-run] (checked by the
  # "request" job). The build uploads nothing; release stays a separate, reviewed workflow.
  pull_request:
    branches: [main]
    paths: [".github/documentary-production-request.json"]

permissions:
  actions: read
  contents: read

# One run of this mode at a time. Each mode has its own queue, so a long
# documentary build cannot hold back (or displace) the daily Shorts and news runs.
concurrency:
  group: studio-build-longform
  cancel-in-progress: false

jobs:
  # Decides what is built: the Run workflow form, or the request file of a pull request.
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      topic: ${{ steps.resolve.outputs.topic }}
      category: ${{ steps.resolve.outputs.category }}
      semantic_review: ${{ steps.resolve.outputs.semantic_review }}
      minutes: ${{ steps.resolve.outputs.minutes }}
      language: ${{ steps.resolve.outputs.language }}
      channel_profile: ${{ steps.resolve.outputs.channel_profile }}
      voice_gender: ${{ steps.resolve.outputs.voice_gender }}
      presenter_mode: ${{ steps.resolve.outputs.presenter_mode }}
      visual_mode: ${{ steps.resolve.outputs.visual_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve the build request
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_SEMANTIC_REVIEW: ${{ inputs.semantic_review }}
          INPUT_MINUTES: ${{ inputs.minutes }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_CHANNEL_PROFILE: ${{ inputs.channel_profile }}
          INPUT_VOICE_GENDER: ${{ inputs.voice_gender }}
          INPUT_PRESENTER_MODE: ${{ inputs.presenter_mode }}
          INPUT_VISUAL_MODE: ${{ inputs.visual_mode }}
        run: |
          HEAD_COMMIT_MESSAGE="$(git log -1 --format=%B)" python3 scripts/resolve_documentary_request.py

  build:
    needs: request
    if: needs.request.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Preflight documentary providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_API_REFERER: ${{ vars.DVIDS_API_REFERER }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          if not os.getenv("GEMINI_API_KEY"):
              print("FATAL: GEMINI_API_KEY is missing; script generation cannot start.")
              sys.exit(1)
          providers = {
              "Pixabay": bool(os.getenv("PIXABAY_API_KEY")),
              "Cloudflare image generation": bool(os.getenv("CLOUDFLARE_ACCOUNT_ID") and os.getenv("CLOUDFLARE_API_TOKEN")),
              "Coverr": bool(os.getenv("COVERR_API_KEY")),
              "DVIDS": bool(os.getenv("DVIDS_API_KEY")),
              "NARA": bool(os.getenv("NARA_API_KEY")),
              "Europeana": bool(os.getenv("EUROPEANA_API_KEY")),
              "Pollinations (keyless fallback)": True,
              "Wikimedia Commons (public API)": True,
              "Internet Archive (public metadata)": True,
          }
          for name, configured in providers.items():
              print(f"Provider {'READY' if configured else 'NOT CONFIGURED'}: {name}")
          if not any(providers[name] for name in ("Pixabay", "Cloudflare image generation", "Coverr")):
              print("WARNING: No keyed general visual provider is configured; archival/context graphics and keyless fallback may be needed.")
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng

      # This workflow runs on GitHub-hosted CPU runners. Chatterbox v3
      # inference is too slow there for dependable long-form production.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Python for SadTalker CPU inference
        if: ${{ needs.request.outputs.presenter_mode == 'sadtalker' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Install SadTalker and pretrained models (CPU)
        if: ${{ needs.request.outputs.presenter_mode == 'sadtalker' }}
        env:
          SADTALKER_DIR: ${{ runner.temp }}/SadTalker
          SADTALKER_VENV: ${{ runner.temp }}/sadtalker-venv
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git "$SADTALKER_DIR"
          python -m venv "$SADTALKER_VENV"
          "$SADTALKER_VENV/bin/python" -m pip install --upgrade pip setuptools wheel
          "$SADTALKER_VENV/bin/python" -m pip install torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          "$SADTALKER_VENV/bin/python" -m pip install -r "$SADTALKER_DIR/requirements.txt"
          # The upstream download script writes to ./checkpoints relative to
          # the current directory. Run it from SadTalker itself so inference.py
          # can find checkpoints/ and the downloaded safetensors weights.
          cd "$SADTALKER_DIR"
          bash scripts/download_models.sh
          test -s checkpoints/SadTalker_V0.0.2_256.safetensors
          test -s checkpoints/mapping_00229-model.pth.tar

      - name: Restore project Python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py

      - name: Test narration provider fallback and long-form package adapter
        run: python -m unittest tests.test_voice_fallback tests.test_voice_text tests.test_voice_pacing tests.test_footage_exposure tests.test_longform_review_package tests.test_upload_documentary_artifact -v

      - name: Install Playwright Chromium for automatic 3D avatar recording
        if: ${{ needs.request.outputs.presenter_mode == 'talking_avatar_auto' }}
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pinned versions from avatar_studio/package-lock.json: the 3D engine, the avatar SDK
      # with its models, and the browser driver. Nothing is fetched from a CDN during the build.
      - name: Install the 3D presenter's pinned browser packages
        if: ${{ needs.request.outputs.presenter_mode == 'talking_avatar_auto' }}
        working-directory: avatar_studio
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build long-form video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are not pinned here. Empty means the built-in chain in core/gemini.py;
          # set the repository variable to override without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL_LONGFORM }}
          GEMINI_PROFILE: longform
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS_LONGFORM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_API_REFERER: ${{ vars.DVIDS_API_REFERER }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          # Hard-disable every hosted AI-video provider in the GitHub-only,
          # zero-paid documentary workflow. Open-weight video models still need
          # GPU compute; standard GitHub-hosted runners are CPU-only.
          FREE_ONLY_MODE: "1"
          AI_VIDEO_ENABLED: "0"
          AI_VIDEO_PROVIDER: "disabled"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_ENGINE: "edge"
          ALLOW_CHATTERBOX_ON_CI: "false"
          CHATTERBOX_TORCH_THREADS: "2"
          PRESENTER_ENABLED: ${{ needs.request.outputs.presenter_mode == 'off' && '0' || '1' }}
          PRESENTER_MODE: ${{ needs.request.outputs.presenter_mode }}
          LONGFORM_VISUAL_MODE: ${{ needs.request.outputs.visual_mode }}
          SADTALKER_DIR: ${{ runner.temp }}/SadTalker
          SADTALKER_PYTHON: ${{ runner.temp }}/sadtalker-venv/bin/python
          SADTALKER_DEVICE: cpu
          PRESENTER_IMAGE: ${{ needs.request.outputs.voice_gender == 'female' && 'assets/presenter/presenter_female.png' || 'assets/presenter/presenter_master.png' }}
          CHANNEL_NAME: "Engineering Physics"
          CHANNEL_PROFILE: ${{ needs.request.outputs.channel_profile || 'beyond_science' }}
          LONGFORM_LANGUAGE: ${{ needs.request.outputs.language || 'hinglish' }}
          # Narration may be Hindi or Hinglish; subtitles are English only.
          SUBTITLE_LANGUAGE: "english"
          VISUAL_SEMANTIC_CHECK: ${{ needs.request.outputs.semantic_review == 'true' && '1' || '0' }}
          VISUAL_SEMANTIC_MAX_SHOTS: "200"
          # Inputs are passed through the environment, never interpolated into
          # the shell script, so a topic containing quotes or $(...) cannot run code.
          INPUT_TOPIC: ${{ needs.request.outputs.topic }}
          INPUT_CATEGORY: ${{ needs.request.outputs.category }}
          INPUT_MINUTES: ${{ needs.request.outputs.minutes }}
          INPUT_LANGUAGE: ${{ needs.request.outputs.language || 'hinglish' }}
          INPUT_VOICE_GENDER: ${{ needs.request.outputs.voice_gender }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_MINUTES" =~ ^(18|20|22|25|28|30)$ ]] || { echo "::error::minutes must be one of 18, 20, 22, 25, 28 or 30."; exit 1; }
          python run.py long "$INPUT_TOPIC" \
            --category "$INPUT_CATEGORY" \
            --minutes "$INPUT_MINUTES" \
            --language "$INPUT_LANGUAGE" \
            --voice-gender "$INPUT_VOICE_GENDER" \
            --force

      # Build and release remain separate jobs. The release job receives YouTube secrets;
      # the renderer never does. It uploads only after the strict machine-only documentary gate passes.
      - name: Assemble the documentary QA package (no upload)
        if: success()
        run: python scripts/package_build_for_review.py --mode longform

      - name: Mark build as ready for the separate private-release gate
        if: always()
        run: |
          echo "The build is complete. The dependent release job will independently validate the package and upload PRIVATE only."

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: "false"
        run: |
          python scripts/write_job_summary.py --pipeline longform \
            --artifact "longform-review-${GITHUB_RUN_ID}"

      # The measured facts of the build (runtime, visual sources, footage providers, presenter
      # motion, subtitles, audio, research) as notices on the run page, readable without
      # downloading the artifact.
      - name: Show the measured build evidence on the run page
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_MINUTES: ${{ needs.request.outputs.minutes }}
        run: python scripts/annotate_build_evidence.py --pipeline longform --target-minutes "$TARGET_MINUTES"

      # Preserve the complete reviewable build, not only the MP4. GitHub-hosted
      # runners are ephemeral, so the visual/source/rights/audio/research decisions
      # and sampled frames must be downloadable after a blocked upload.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: longform-review-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            build/job_*/
            youtube-upload-result.json
            youtube-upload-failure.json
          if-no-files-found: error
          retention-days: 14

      # Keep compact QA evidence independently downloadable even when the full
      # review bundle is multi-gigabyte or the package step exits non-zero.
      - name: Upload compact documentary QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longform-qa-diagnostics-${{ github.run_id }}
          path: |
            output/run_report.json
            build/job_*/quality_report.json
            build/job_*/release_metadata.json
            build/job_*/script.json
            build/job_*/visual_consistency_report.json
            build/job_*/visual_review_report.json
            build/job_*/research_verification_report.json
            build/job_*/audio_quality_report.json
            build/job_*/licenses.csv
            build/job_*/credits.txt
            build/job_*/provider_report.json
            build/job_*/narration_synthesis_report.json
            build/job_*/shared_review_package/qa/*.json
            build/job_*/shared_review_package/package_summary.json
          if-no-files-found: warn
          retention-days: 14

      # Offer a small, direct-download MP4 artifact separately from the full
      # multi-gigabyte review bundle. This contains only the final rendered video;
      # QA evidence and source assets remain in the review artifact below.
      - name: Upload MP4-only documentary output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longform-mp4-${{ github.run_id }}
          path: output/longform_*.mp4
          if-no-files-found: warn
          retention-days: 14

      # Build state remains an Actions artifact/local runtime concern; never
      # commit a live SQLite database or grant this render workflow write access.

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "make-longform"


  # Autonomous release: the renderer has no YouTube credentials. This dependent
  # job downloads this exact run's artifact and applies the stricter machine-only
  # documentary gate. Any missing evidence, uncertain shot, non-PASS QA, rights
  # issue, channel mismatch or upload/read-back problem fails closed.
  release:
    needs: [request, build]
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify this exact successful documentary build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: python scripts/verify_source_run.py --run-id "$SOURCE_RUN_ID" --mode longform --ref "$GITHUB_REF_NAME"

      - name: Install FFmpeg and uploader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-ci.txt

      - name: Download the documentary artifact from this exact run
        uses: actions/download-artifact@v8
        with:
          name: longform-review-${{ github.run_id }}
          path: release-artifact

      - name: Run strict machine-only documentary release and verify PRIVATE status
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_CHANNEL_HANDLE: ${{ vars.YT_CHANNEL_HANDLE || '@engineeringphysics-n5g' }}
          YT_CHANNEL_VERIFY: "1"
          CHANNEL_NAME: "Engineering Physics"
        run: |
          set -euo pipefail
          test -n "$YT_CLIENT_ID" || { echo "::error::YT_CLIENT_ID is missing."; exit 1; }
          test -n "$YT_CLIENT_SECRET" || { echo "::error::YT_CLIENT_SECRET is missing."; exit 1; }
          test -n "$YT_REFRESH_TOKEN" || { echo "::error::YT_REFRESH_TOKEN is missing."; exit 1; }
          python scripts/upload_documentary_artifact.py \
            --artifact-dir release-artifact \
            --source-run-id "$GITHUB_RUN_ID" \
            --machine-only

      - name: Write private-release result to the run summary
        if: always()
        run: |
          if [[ -s release-artifact/youtube-upload-result.json ]]; then
            echo "## Documentary private upload" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("release-artifact/youtube-upload-result.json").read_text())
          print(f"- **Result:** {'PRIVATE verified' if data.get('privacy_verified') else 'NOT VERIFIED'}")
          print(f"- **Video:** {data.get('url', 'unavailable')}")
          print(f"- **Video ID:** `{data.get('video_id', 'unavailable')}`")
          print(f"- **Processing:** {data.get('processing_status', 'unknown')}")
          print(f"- **SHA-256:** `{data.get('sha256', 'unavailable')}`")
          PY
          elif [[ -s release-artifact/youtube-upload-failure.json ]]; then
            echo "## Documentary upload blocked" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("release-artifact/youtube-upload-failure.json").read_text())
          print(f"**Nothing was uploaded.** {data.get('error', 'Unknown release failure')}")
          PY
          else
            echo "## Documentary upload not completed. No verified private upload result exists." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longform-private-release-${{ github.run_id }}
          path: |
            release-artifact/youtube-upload-result.json
            release-artifact/youtube-upload-failure.json
          if-no-files-found: warn
          retention-days: 90

      - name: Alert on release failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "longform-private-release"
