name: make-longform
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
      category:
        description: "Category"
        type: choice
        options: [geopolitics, history, science, technology, economics, india, mystery, education, finance, markets, money, power, human]
        default: geopolitics
      minutes:
        description: "Target length in minutes"
        type: choice
        options: ["10", "12", "15"]
        default: "12"
      upload:
        description: "Upload to YouTube after building? (approval recommended)"
        type: boolean
        default: false
      voice_gender:
        description: "Narration voice"
        type: choice
        options: [male, female]
        default: male

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Cache Chatterbox model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v3-${{ runner.os }}-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py

      - name: Build long-form video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FALLBACK_MODELS: "gemini-3.5-flash-lite,gemini-2.5-flash"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_ENGINE: "chatterbox"
          CHATTERBOX_TORCH_THREADS: "2"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "unlisted"
        run: |
          python run.py long "${{ inputs.topic }}" \
            --category "${{ inputs.category }}" \
            --minutes ${{ inputs.minutes }} \
            --language hinglish \
            --voice-gender "${{ inputs.voice_gender }}"

      - name: Upload to YouTube
        if: ${{ inputs.upload }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "unlisted"
        run: python run_daily.py --upload-latest --format long

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longform-video
          path: output/*.mp4
          if-no-files-found: ignore

      - name: Save database
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f db/studio.sqlite 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bot: update studio db"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Database push attempt $attempt failed; retrying..."
              sleep $((attempt * 3))
            done
            echo "Could not persist workflow database after 3 attempts."
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="❌ AI Studio make-longform failed. Check GitHub Actions." > /dev/null
          fi
