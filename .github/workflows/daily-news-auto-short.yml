name: 'Daily news Short — automatic (private upload)'
# Fully automatic path: discover → corroborate with the source-tier gate → script →
# render → PRIVATE upload. Stories that are single-source, stale, sensitive or
# cannot be grounded are skipped; a skipped run is a success, not a failure.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Narration language"
        type: choice
        options: [english, hinglish, hindi]
        default: english
      upload:
        description: "Upload the finished Short to YouTube as PRIVATE"
        type: boolean
        default: true
  schedule:
    - cron: '45 2 * * *'    # 08:15 IST
    - cron: '45 13 * * *'   # 19:15 IST

permissions:
  contents: write   # only to push JSON state to the automation-state branch

concurrency:
  group: studio-build
  cancel-in-progress: false

env:
  CHANNEL_NAME: "Engineering Physics"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  news-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system dependencies (bounded retries)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libraqm0; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::Could not install FFmpeg after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Restore duplicate ledger and seen-story cache
        run: python scripts/persist_state.py restore

      - name: Select, write, render and upload (private) one news Short
        id: news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
          TTS_ENGINE: "edge"
          NEWS_LANGUAGE: ${{ inputs.language || 'english' }}
          WANT_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
          # One bounded recovery attempt: a job that fails part-way is resumed from
          # its checkpoint (finished narration and visuals are reused). 0 turns it off.
          BUILD_RECOVERY_ATTEMPTS: ${{ vars.BUILD_RECOVERY_ATTEMPTS || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WANT_UPLOAD" = "true" ]; then
            python scripts/build_with_recovery.py --upload-after-recovery -- \
              python scripts/run_daily_news_short.py --upload
          else
            python scripts/build_with_recovery.py -- python scripts/run_daily_news_short.py
          fi

      - name: Persist duplicate ledger and seen-story cache
        if: always()
        env:
          # Explicit token for the push to the state branch, so the step does not
          # depend on how actions/checkout stores its credential.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "news run ${GITHUB_RUN_ID}"

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: python scripts/write_job_summary.py --pipeline news_short --artifact "news-short-auto-${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: news-short-auto-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            output/daily_news/
            output/logs/
            build/job_*/
            !build/job_*/render_work/
            state/
          if-no-files-found: warn
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: python scripts/alert_on_failure.py --name "daily news Short"
