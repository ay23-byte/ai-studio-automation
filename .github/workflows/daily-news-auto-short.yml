name: 'Daily news Short — automatic PRIVATE release'
# Automatic path: discover → source-tier/safety gates → script → render → strict
# technical QA → PRIVATE upload → YouTube privacy read-back. Ineligible stories
# are skipped; failed automated release checks block upload and preserve evidence.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Narration language"
        type: choice
        options: [english, hinglish, hindi]
        default: english
  schedule:
    - cron: '45 2 * * *'    # 08:15 IST
    - cron: '45 13 * * *'   # 19:15 IST

permissions:
  contents: write   # only to push JSON state to the automation-state branch

concurrency:
  group: studio-build-daily-news
  cancel-in-progress: false

env:
  CHANNEL_NAME: "Engineering Physics"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system dependencies (bounded retries)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libraqm0; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::Could not install FFmpeg after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Preflight image provenance and licence checks
        run: python -m unittest discover -s tests -p "test_image_provenance.py" -v

      - name: Restore duplicate ledger and seen-story cache
        run: python scripts/persist_state.py restore

      # Build job is credential-isolated: no YouTube OAuth secrets are present here.
      - name: Select, write and render (no upload)
        id: news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_API_REFERER: ${{ secrets.DVIDS_API_REFERER }}
          FOOTAGE_CONTACT: ${{ vars.FOOTAGE_CONTACT }}
          TTS_ENGINE: "edge"
          NEWS_LANGUAGE: ${{ inputs.language || 'english' }}
          # If all configured text providers are temporarily unavailable, use the
          # deterministic source-attributed template. It still passes the same
          # grounding/content QA; it cannot introduce unsupported facts.
          NEWS_TEMPLATE_FALLBACK: "1"
          BUILD_RECOVERY_ATTEMPTS: ${{ vars.BUILD_RECOVERY_ATTEMPTS || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_with_recovery.py -- python scripts/run_daily_news_short.py

      - name: Assemble the diagnostic and review package
        if: always()
        run: python scripts/package_build_for_review.py --mode daily_news --allow-no-build

      - name: Persist duplicate ledger and seen-story cache
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "news build ${GITHUB_RUN_ID}"

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: "true"
        run: python scripts/write_job_summary.py --pipeline news_short --artifact "news-short-auto-${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: news-short-auto-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            output/daily_news/
            output/logs/
            build/job_*/
            !build/job_*/render_work/
            db/studio.sqlite
            state/
          if-no-files-found: warn
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: python scripts/alert_on_failure.py --name "daily news Short build"

  # Release job receives YouTube credentials only after the isolated build succeeds.
  release:
    name: Guarded automatic PRIVATE YouTube release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Download this run's exact build artifact
        uses: actions/download-artifact@v8
        with:
          name: news-short-auto-${{ github.run_id }}
          path: .

      - name: Verify the artifact is complete before release
        shell: bash
        run: |
          set -euo pipefail
          test -s db/studio.sqlite
          compgen -G "build/job_*/quality_report.json" >/dev/null || echo "No quality report; release script will fail closed."
          echo "Exact news build artifact is present."

      - name: Restore duplicate ledger and seen-story cache
        run: python scripts/persist_state.py restore

      - name: Run guarded PRIVATE release
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_CHANNEL_HANDLE: ${{ vars.YT_CHANNEL_HANDLE || '@engineeringphysics-n5g' }}
          YT_CHANNEL_VERIFY: "1"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
        run: python scripts/release_news_job.py --build-result output/daily_news/build_result.json

      - name: Persist duplicate ledger and upload state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "news release ${GITHUB_RUN_ID}"

      - name: Preserve private-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-short-release-${{ github.run_id }}
          path: |
            build/job_*/automatic_private_release.json
            build/job_*/upload_pending.json
            db/studio.sqlite
            state/
          if-no-files-found: warn
          retention-days: 90

      - name: Alert on failure
        if: failure()
        run: python scripts/alert_on_failure.py --name "daily news Short release"
