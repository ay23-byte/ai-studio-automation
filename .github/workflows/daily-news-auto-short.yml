name: 'Daily news Short — build for automatic PRIVATE release'
# Build path: discover → source-tier/safety gates → script → render → QA package.
# This job has no YouTube credentials. A separate workflow_run release job receives
# credentials only after this exact build succeeds, then runs strict machine QA and
# uploads PRIVATE only. Sensitive stories and any failed QA remain blocked.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Narration language"
        type: choice
        options: [english, hinglish, hindi]
        default: hinglish
  schedule:
    - cron: '45 2 * * *'    # 08:15 IST
    - cron: '45 13 * * *'   # 19:15 IST

permissions:
  contents: write   # only to push JSON state to the automation-state branch

concurrency:
  group: studio-build-daily-news
  cancel-in-progress: false

env:
  CHANNEL_NAME: "Engineering Physics"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_API_KEY || secrets.YT_API_KEY }}

jobs:
  news-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system dependencies (bounded retries)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
               sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends --fix-missing ffmpeg espeak-ng libraqm0 libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core libegl1 libgl1 libgl1-mesa-dri; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::Could not install FFmpeg after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements-ci.txt &&
               python -m pip install --retries 5 --timeout 60 -r requirements-animation.txt; then break; fi
            [ "$attempt" -lt 3 ] || { echo "::error::Python dependencies failed after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done

      # Edge TTS is the selected neural narrator for this newsroom workflow.
      # It honors the configured en-IN/hi-IN voice IDs; Chatterbox's current
      # integration ignores TTS_VOICE and was masking the intended speaker choice.
      - name: Preflight image provenance and licence checks
        run: python -m unittest discover -s tests -p "test_image_provenance.py" -v

      - name: Restore duplicate ledger and seen-story cache
        run: python scripts/persist_state.py restore

      - name: Select, write, render and prepare human review package
        id: news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_LLM_MODEL: ${{ vars.NVIDIA_LLM_MODEL }}
          NVIDIA_IMAGE_MODEL: ${{ vars.NVIDIA_IMAGE_MODEL }}
          NVIDIA_IMAGE_ENABLED: ${{ vars.NVIDIA_IMAGE_ENABLED || '0' }}
          NVIDIA_TTS_ENABLED: ${{ vars.NVIDIA_TTS_ENABLED || '0' }}
          NVIDIA_TTS_MODEL: ${{ vars.NVIDIA_TTS_MODEL }}
          NVIDIA_TTS_VOICE: ${{ vars.NVIDIA_TTS_VOICE }}
          LLM_PROVIDER_ORDER: "groq,cerebras,openrouter,mistral,nvidia"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          DVIDS_API_REFERER: ${{ secrets.DVIDS_API_REFERER }}
          FOOTAGE_CONTACT: ${{ vars.FOOTAGE_CONTACT }}
          PV2_ANIMATION_MODE: "auto_strict"
          PV2_BLENDER_BACKEND: "bpy"
          TTS_ENGINE: "edge"
          TTS_REQUIRE_ENGINE: "edge"
          TTS_VOICE: ${{ inputs.language == 'english' && 'en-IN-PrabhatNeural' || 'hi-IN-MadhurNeural' }}
          TTS_PAUSE_SCALE: "1.15"
          TTS_REJECT_ROBOTIC_FALLBACK: "1"
          TTS_RATE: "-2%"
          TTS_OPENING_RATE: "-3%"
          TTS_CLOSING_RATE: "-2%"
          NEWS_LANGUAGE: ${{ inputs.language || 'hinglish' }}
          # Do not silently substitute an English template for the requested Hinglish anchor voice.
          NEWS_TEMPLATE_FALLBACK: ${{ inputs.language == 'english' && '1' || '0' }}
          SHORTS_SUBTITLE_LANGUAGE: "english"
          WANT_UPLOAD: "false"
          # The build job is credential-isolated. A separate release job uploads
          # this exact artifact only after the machine-only newsroom release gate.
          # No generic template fallback: if a newsroom-quality script cannot be
          # generated and validated, skip production rather than publish filler.
          BUILD_RECOVERY_ATTEMPTS: ${{ vars.BUILD_RECOVERY_ATTEMPTS || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep YouTube credentials out of the renderer. The downstream release job
          # restores this exact run's database and files, then invokes the existing
          # fail-closed daily-news release gate before any PRIVATE upload.
          python scripts/build_with_recovery.py -- python scripts/run_daily_news_short.py

      - name: Assemble the diagnostic and review package
        if: always()
        run: python scripts/package_build_for_review.py --mode daily_news --allow-no-build

      - name: Persist duplicate ledger and seen-story cache
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "news run ${GITHUB_RUN_ID}"

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: "false"
        run: python scripts/write_job_summary.py --pipeline news_short --artifact "news-short-auto-${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: news-short-auto-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            output/daily_news/
            output/logs/
            build/job_*/
            !build/job_*/render_work/
            state/
            db/studio.sqlite
          if-no-files-found: warn
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: python scripts/alert_on_failure.py --name "daily news Short"


  # YouTube credentials are isolated to this dependent job. It consumes the
  # exact artifact from the build above and uploads PRIVATE only after every
  # existing daily-news machine gate passes.
  release:
    name: Strict QA and automatic PRIVATE YouTube release
    needs: news-short
    if: ${{ needs.news-short.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install FFmpeg and release dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
                 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends --fix-missing ffmpeg; then break; fi
              [[ "$attempt" -lt 3 ]] || { echo "::error::FFmpeg/FFprobe installation failed after 3 attempts."; exit 1; }
              sleep $((attempt * 10))
            done
          fi
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          python -m pip install --retries 5 --timeout 60 -r requirements-ci.txt

      - name: Download the exact build artifact, including its job database
        uses: actions/download-artifact@v8
        with:
          name: news-short-auto-${{ github.run_id }}
          path: .

      - name: Confirm this run produced a news job
        run: |
          set -euo pipefail
          test -s db/studio.sqlite
          if ! compgen -G "build/job_*/verification.json" >/dev/null; then
            echo "No eligible news story was built in this run; no upload is needed."
          fi

      - name: Run fail-closed QA and upload PRIVATE to Engineering Physics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_CHANNEL_HANDLE: ${{ vars.YT_CHANNEL_HANDLE || '@engineeringphysics-n5g' }}
          YT_CHANNEL_VERIFY: "1"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
          ALLOW_PUBLIC_PUBLISH: "0"
        run: python scripts/release_news_private_artifact.py

      - name: Preserve private-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-private-release-${{ github.run_id }}
          path: |
            build/job_*/automatic_private_release.json
          if-no-files-found: warn
          retention-days: 90

      - name: Alert on release failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/alert_on_failure.py --name "daily news private release"
