name: '1. Create and upload a Short — automatic'
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave blank to pick the next unused topic automatically)"
        required: false
        default: ""
      category:
        description: "Category (used only with a custom topic)"
        type: choice
        options: [physics, engineering, technology, science, finance, markets, money, power, human]
        default: physics
      language:
        description: "Voice language"
        type: choice
        options: [hinglish, hindi, english]
        default: hinglish
      upload:
        description: "Upload the finished Short to YouTube as PRIVATE"
        type: boolean
        default: true
      force:
        description: "Build even if this topic was already produced"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily

permissions:
  contents: write   # only to push JSON state to the automation-state branch

concurrency:
  group: studio-build
  cancel-in-progress: false

env:
  CHANNEL_NAME: "Engineering Physics"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system dependencies (bounded retries)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libraqm0; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::Could not install FFmpeg after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate Python syntax
        run: python -m compileall -q core run.py run_daily.py scripts

      - name: Restore duplicate ledger from the automation-state branch
        run: python scripts/persist_state.py restore

      - name: Preflight health check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run.py doctor

      - name: Build Shorts video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FALLBACK_MODELS: "gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          # Optional free fallbacks used automatically when Gemini is unavailable.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_ENGINE: "edge"
          ALLOW_CHATTERBOX_ON_CI: "false"
          SHORTS_LANGUAGE: ${{ inputs.language || 'hinglish' }}
          # Inputs travel through the environment and are never interpolated
          # into the script, so a topic cannot inject shell commands.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_CATEGORY: ${{ inputs.category || 'physics' }}
          INPUT_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TOPIC// /}" ]; then
            ARGS=(shorts "$INPUT_TOPIC" --category "$INPUT_CATEGORY" --language "$SHORTS_LANGUAGE")
            if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
            python run.py "${ARGS[@]}"
          else
            python run_daily.py --format shorts
          fi

      - name: Upload completed Short to YouTube (Private)
        if: success() && (github.event_name == 'schedule' || inputs.upload)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          PRIVACY: "private"
          PUBLISH_AT_IST: ""
        shell: bash
        run: |
          set -euo pipefail
          if ! ls output/shorts_*.mp4 >/dev/null 2>&1; then
            echo "::notice::No new Short was built in this run (no unused topic or nothing to do); skipping upload."
            exit 0
          fi
          python run_daily.py --format shorts --upload-latest

      - name: Persist duplicate ledger to the automation-state branch
        if: always()
        run: python scripts/persist_state.py save --message "shorts run ${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-review-${{ github.run_id }}
          path: |
            output/*.mp4
            output/logs/
            build/job_*/
            !build/job_*/render_work/
            db/studio.sqlite
            state/
          if-no-files-found: warn
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          from core.notify import send
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          send(f"❌ AI Studio make-shorts failed. {url}")
          PY
