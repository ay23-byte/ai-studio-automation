name: make-shorts
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave blank to use next from topics.json)"
        required: false
        default: ""
      category:
        description: "Category"
        type: choice
        options: [finance, markets, money, power, human]
        default: finance
      language:
        description: "Voice language"
        type: choice
        options: [hindi, english]
        default: hindi
      upload:
        description: "Upload to YouTube after building?"
        type: boolean
        default: true
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Cache Chatterbox model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v3-${{ runner.os }}-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Shorts video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FALLBACK_MODEL: "gemini-3.5-flash-lite"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_ENGINE: "chatterbox"
          CHATTERBOX_TORCH_THREADS: "2"
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "public"
          # PUBLISH_AT_IST: "19:00"
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            python run.py shorts "${{ inputs.topic }}" \
              --category "${{ inputs.category }}" \
              --language "${{ inputs.language }}"
          else
            python run_daily.py --format shorts
          fi

      - name: Upload to YouTube
        if: ${{ inputs.upload || github.event_name == 'schedule' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_NAME: "Engineering Physics"
          PRIVACY: "public"
        run: python run_daily.py --upload-latest --format shorts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-video
          path: output/*.mp4
          if-no-files-found: ignore

      - name: Save database
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f db/studio.sqlite 2>/dev/null || true
          git add topics.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot: update studio db" && git pull --rebase && git push)

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="❌ AI Studio make-shorts failed. Check GitHub Actions." > /dev/null
          fi
