name: '1. Build a Short — review required'
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave blank to pick the next unused topic automatically)"
        required: false
        default: ""
      category:
        description: "Category (used only with a custom topic)"
        type: choice
        options: [physics, engineering, technology, science, finance, markets, money, power, human, geopolitics, history, economics, international_relations, india, world_affairs]
        default: physics
      language:
        description: "Voice language"
        type: choice
        options: [hinglish, hindi, english]
        default: hinglish
      upload:
        description: "Deprecated: builds are review-only; use the separate approved private-release workflow"
        type: boolean
        default: false
      force:
        description: "Build even if this topic was already produced"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily

permissions:
  contents: write   # only to push JSON state to the automation-state branch

# One run of this mode at a time. Each mode has its own queue, so a long
# documentary build cannot hold back (or displace) the daily Shorts and news runs.
concurrency:
  group: studio-build-shortform
  cancel-in-progress: false

env:
  CHANNEL_NAME: "Engineering Physics"
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system dependencies (bounded retries)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libraqm0; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::Could not install FFmpeg after 3 attempts."; exit 1; }
            sleep $((attempt * 10))
          done
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate Python syntax
        run: python -m compileall -q core run.py run_daily.py scripts

      - name: Restore duplicate ledger from the automation-state branch
        run: python scripts/persist_state.py restore

      - name: Preflight health check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # No YouTube credentials here: a build workflow never uploads, so it never
          # receives them. The doctor reports their absence as a warning only.
        run: python run.py doctor

      - name: Build Shorts video
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are not pinned here. Empty means the built-in chain in core/gemini.py;
          # set the repository variable to override without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          # Optional free fallbacks used automatically when Gemini is unavailable.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_ENGINE: "edge"
          ALLOW_CHATTERBOX_ON_CI: "false"
          SHORTS_LANGUAGE: ${{ inputs.language || 'hinglish' }}
          # Inputs travel through the environment and are never interpolated
          # into the script, so a topic cannot inject shell commands.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_CATEGORY: ${{ inputs.category || 'physics' }}
          INPUT_FORCE: ${{ inputs.force }}
          # One bounded recovery attempt: a job that fails part-way is resumed from
          # its checkpoint (finished narration and visuals are reused). 0 turns it off.
          BUILD_RECOVERY_ATTEMPTS: ${{ vars.BUILD_RECOVERY_ATTEMPTS || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TOPIC// /}" ]; then
            ARGS=(shorts "$INPUT_TOPIC" --category "$INPUT_CATEGORY" --language "$SHORTS_LANGUAGE")
            if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
            python scripts/build_with_recovery.py -- python run.py "${ARGS[@]}"
          else
            python scripts/build_with_recovery.py -- python run_daily.py --format shorts
          fi

      # Review-only: assembles the shared package (manifest, QA, dashboard). No upload.
      # Fails the run when the Short cannot be approved (failed QA, robotic fallback
      # voice, card slideshow), so a green run always means "ready for a human".
      - name: Assemble the review package (no upload)
        if: success()
        run: python scripts/package_build_for_review.py --mode shortform

      - name: Persist duplicate ledger to the automation-state branch
        if: always()
        env:
          # Explicit token for the push to the state branch, so the step does not
          # depend on how actions/checkout stores its credential.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_state.py save --message "shorts run ${GITHUB_RUN_ID}"

      - name: Write job summary and run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOAD_REQUESTED: "false"
        run: python scripts/write_job_summary.py --pipeline shorts --artifact "shorts-review-${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shorts-review-${{ github.run_id }}
          path: |
            output/*.mp4
            output/run_report.json
            output/logs/
            build/job_*/
            !build/job_*/render_work/
            db/studio.sqlite
            state/
          if-no-files-found: warn
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: python scripts/alert_on_failure.py --name "make-shorts"
