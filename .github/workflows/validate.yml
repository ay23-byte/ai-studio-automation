name: validate
on:
  push:
    branches: [main, feature/visual-editorial-approval, production-trial/disappearing-villages]
  pull_request:
    branches: [main, feature/universal-cinematic-visual-qc, production-trial/disappearing-villages]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install requests google-api-python-client google-auth google-auth-oauthlib edge-tts python-dotenv Pillow
      - name: Compile all Python modules
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py dashboard.py pages tests
      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v
