name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

# A newer push to the same pull request supersedes the older validation run.
# Runs on main are never cancelled, so every merged commit is fully validated.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Compile all Python modules
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py dashboard.py pages scripts tests
      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v
      # 22 pytest-style tests were never collected by unittest and silently
      # never ran in CI; pytest runs both styles.
      - name: Run the complete test suite (pytest collects function-style tests too)
        run: python -m pytest tests -q
      - name: Verify the tracked database was not modified by tests
        run: git diff --exit-code -- db/studio.sqlite

  # The scheduled news-collection workflow installs only requests + Pillow.
  # Run 43305710825 failed there because a module imported an optional voice
  # provider at import time. This job reproduces that exact environment on every
  # pull request, so the next such import is caught before it reaches a schedule.
  news-collect-minimal-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exactly what daily-news-shorts.yml installs
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
          python -m pip check
      - name: Optional providers must be absent in this job
        run: |
          python - <<'PY'
          import importlib.util
          present = [name for name in ("edge_tts", "googleapiclient", "pandas") if importlib.util.find_spec(name)]
          raise SystemExit(f"unexpected packages installed: {present}" if present else 0)
          PY
      - name: Compile news modules
        run: python -m compileall -q core scripts
      - name: Run the news test suite without optional providers
        run: python -m unittest discover -s tests -p 'test_*news*.py' -v

  ffmpeg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check for FFmpeg and FFprobe
        id: ffmpeg-check
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Both FFmpeg and FFprobe are already installed."
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "FFmpeg and/or FFprobe are missing; attempting installation."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install FFmpeg and FFprobe with bounded retries
        if: steps.ffmpeg-check.outputs.installed != 'true'
        shell: bash
        run: |
          set -u
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "FFmpeg installation attempt $attempt/$max_attempts"
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
                echo "FFmpeg and FFprobe installed successfully."
                break
              fi
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "Installation attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "::error::FFmpeg/FFprobe are unavailable after ${max_attempts} installation attempts. Check the Ubuntu package mirror/network or runner image."
            exit 1
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render test dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Run end-to-end Shorts render test (offline, real FFmpeg)
        run: python -m pytest tests/test_e2e_shorts_render.py -q
      - name: Run cinematic FFmpeg render smoke tests
        run: python -m unittest discover -s tests -p 'test_cinematic_ffmpeg_render.py' -v
      - name: Run release certification FFmpeg smoke test
        run: python -m unittest discover -s tests -p 'test_release_certification_smoke.py' -v
      - name: Run archival video FFmpeg integration tests
        run: python -m unittest discover -s tests -p 'test_archival_video_e2e.py' -v
