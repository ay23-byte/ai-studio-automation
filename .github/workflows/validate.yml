name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install requests google-api-python-client google-auth google-auth-oauthlib edge-tts python-dotenv Pillow pandas
      - name: Compile all Python modules
        run: python -m compileall -q core run.py run_daily.py get_refresh_tokens.py dashboard.py pages scripts tests
      - name: Install FFmpeg for real render smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v
