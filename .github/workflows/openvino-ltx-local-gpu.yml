name: Free local AI video generation — Intel Iris Xe

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Cinematic scene prompt
        required: true
        type: string
      aspect_ratio:
        description: Output composition
        required: true
        type: choice
        options:
          - "9:16"
          - "16:9"
        default: "9:16"

permissions:
  contents: read

concurrency:
  group: openvino-ltx-local-gpu
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64, intel-iris-xe]
    timeout-minutes: 360
    env:
      OPENVINO_DEVICE: GPU
      OPENVINO_VIDEO_FRAMES: "57"
      OPENVINO_VIDEO_STEPS: "25"
      OPENVINO_VIDEO_FPS: "25"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "120"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Select model storage drive and check free space
        shell: powershell
        run: |
          $requiredBytes = 80GB
          $selectedRoot = $null
          foreach ($driveLetter in @("D", "C")) {
            $volume = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($driveLetter):'"
            if ($null -eq $volume) { continue }
            $freeBytes = [int64]$volume.FreeSpace
            Write-Host "$driveLetter`: free space = $([math]::Round($freeBytes / 1GB, 1)) GB"
            if ($freeBytes -ge $requiredBytes) {
              $selectedRoot = "$($driveLetter):\AI-Video-Models"
              break
            }
          }
          if (-not $selectedRoot) {
            throw "At least 80 GB free space is required on D: or C: for the LTX-Video source model and OpenVINO export. Free space and rerun; no model download was started."
          }
          New-Item -ItemType Directory -Force -Path $selectedRoot | Out-Null
          "OPENVINO_MODEL_STORAGE_ROOT=$selectedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Selected model storage: $selectedRoot"

      - name: Configure persistent Hugging Face cache
        shell: powershell
        run: |
          $hfHome = Join-Path $env:OPENVINO_MODEL_STORAGE_ROOT "huggingface"
          New-Item -ItemType Directory -Force -Path $hfHome | Out-Null
          "HF_HOME=$hfHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Hugging Face cache: $hfHome"

      - name: Check out project
        uses: actions/checkout@v4

      - name: Install isolated OpenVINO environment with compatible Transformers
        id: install
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "openvino-ltx-venv"
          if (-not (Test-Path (Join-Path $venv "Scripts\python.exe"))) {
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $py = Join-Path $venv "Scripts\python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --upgrade-strategy eager openvino-genai optimum-intel "transformers<5" "diffusers==0.35.1" numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENVINO_LTX_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $py -c "import transformers, diffusers, openvino_genai; print('transformers', transformers.__version__); print('diffusers', diffusers.__version__); print('OpenVINO GenAI import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Hugging Face network access
        shell: powershell
        run: |
          $hosts = @("huggingface.co", "us.aws.cdn.hf.co")
          foreach ($hostName in $hosts) {
            $resolved = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Resolve-DnsName $hostName -ErrorAction Stop | Out-Null
                Write-Host "DNS OK: $hostName"
                $resolved = $true
                break
              } catch {
                Write-Warning "DNS attempt $attempt/5 failed for $hostName"
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            if (-not $resolved) {
              throw "Cannot resolve $hostName. Check this PC's internet/DNS connection, VPN, proxy, or firewall, then rerun."
            }
          }

      - name: Export INT8 LTX-Video model with resumable downloads and retries
        id: model
        timeout-minutes: 300
        shell: powershell
        run: |
          $modelDir = Join-Path $env:OPENVINO_MODEL_STORAGE_ROOT "ltx_video_openvino_int8"
          $py = Join-Path $env:OPENVINO_LTX_VENV "Scripts\python.exe"
          $cli = Join-Path $env:OPENVINO_LTX_VENV "Scripts\optimum-cli.exe"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $exported = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "LTX model export attempt $attempt/4"
            & $cli export openvino --model Lightricks/LTX-Video --task text-to-video --weight-format int8 $modelDir
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $modelDir "model_index.json"))) {
              $exported = $true
              break
            }
            if ($attempt -lt 4) {
              Write-Warning "Export failed; waiting 45 seconds before retry. Hugging Face downloads should resume from cache."
              Start-Sleep -Seconds 45
            }
          }
          if (-not $exported) {
            throw "LTX-Video export failed after 4 attempts. Review Hugging Face connectivity and available disk space."
          }
          "OPENVINO_LTX_MODEL_DIR=$modelDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate AI video review clip
        shell: powershell
        env:
          PROMPT: ${{ inputs.prompt }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
        run: |
          $py = Join-Path $env:OPENVINO_LTX_VENV "Scripts\python.exe"
          & $py scripts/generate_openvino_video.py --prompt "$env:PROMPT" --aspect-ratio "$env:ASPECT_RATIO" --output "output/openvino_ltx_review.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvino-ltx-ai-video-review
          path: |
            output/openvino_ltx_review.mp4
            output/openvino_ltx_review.mp4.source.json
          if-no-files-found: error
          retention-days: 7
