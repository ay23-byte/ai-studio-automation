name: Free local AI video generation — Intel Iris Xe

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Cinematic scene prompt
        required: true
        type: string
      aspect_ratio:
        description: Output composition
        required: true
        type: choice
        options:
          - "9:16"
          - "16:9"
        default: "9:16"

permissions:
  contents: read

concurrency:
  group: openvino-ltx-local-gpu
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64, intel-iris-xe]
    timeout-minutes: 360
    env:
      OPENVINO_DEVICE: GPU
      OPENVINO_VIDEO_WIDTH: "320"
      OPENVINO_VIDEO_HEIGHT: "576"
      OPENVINO_VIDEO_FRAMES: "17"
      OPENVINO_VIDEO_STEPS: "8"
      OPENVINO_VIDEO_FPS: "12"
      HF_HUB_DOWNLOAD_TIMEOUT: "1800"
      HF_HUB_ETAG_TIMEOUT: "120"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_XET_CLIENT_READ_TIMEOUT: "900"
      HF_XET_CLIENT_RETRY_MAX_ATTEMPTS: "10"
      HF_XET_CLIENT_RETRY_BASE_DELAY: "5000"

    steps:
      - name: Remove only the stale LTX cache from the old C-drive location
        shell: powershell
        run: |
          $legacyCache = Join-Path $env:RUNNER_TOOL_CACHE "huggingface\hub\models--Lightricks--LTX-Video"
          if (Test-Path -LiteralPath $legacyCache) {
            Write-Host "Removing stale LTX-only cache from the previous C-drive location: $legacyCache"
            Remove-Item -LiteralPath $legacyCache -Recurse -Force
          } else {
            Write-Host "No legacy LTX cache found."
          }

      - name: Select split model storage and check free space
        shell: powershell
        run: |
          $drives = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { $_.DeviceID -match '^[A-Z]:$' } |
            ForEach-Object {
              [pscustomobject]@{
                Root = $_.DeviceID
                FreeBytes = [int64]$_.FreeSpace
              }
            } |
            Sort-Object FreeBytes -Descending)

          foreach ($drive in $drives) {
            Write-Host "$($drive.Root) free space = $([math]::Round($drive.FreeBytes / 1GB, 1)) GB"
          }

          $cacheDrive = $drives | Where-Object { $_.FreeBytes -ge 40GB } | Select-Object -First 1
          $workDrive = $drives | Where-Object {
            $_.Root -ne $cacheDrive.Root -and $_.FreeBytes -ge 35GB
          } | Select-Object -First 1

          if ($null -eq $cacheDrive -or $null -eq $workDrive) {
            throw "LTX needs one drive with at least 40 GB free for the Hugging Face cache and a different drive with at least 35 GB free for the OpenVINO export, Python environment and temporary files. No model download was started."
          }

          $storageRoot = Join-Path $workDrive.Root "AI-Video-Models"
          $hfHome = Join-Path $cacheDrive.Root "AI-Video-Cache\huggingface"
          $venv = Join-Path $storageRoot "openvino-ltx-venv"
          $pipCache = Join-Path $storageRoot "pip-cache"
          $tempRoot = Join-Path $storageRoot "temp"

          foreach ($path in @($storageRoot, $hfHome, $pipCache, $tempRoot)) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          "OPENVINO_MODEL_STORAGE_ROOT=$storageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HF_HOME=$hfHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PIP_CACHE_DIR=$pipCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENVINO_LTX_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Hugging Face cache drive: $($cacheDrive.Root)"
          Write-Host "Hugging Face cache: $hfHome"
          Write-Host "OpenVINO work drive: $($workDrive.Root)"
          Write-Host "OpenVINO work root: $storageRoot"

      - name: Configure persistent Hugging Face cache
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:HF_HOME | Out-Null
          Write-Host "Hugging Face cache: $env:HF_HOME"

      - name: Check out project
        uses: actions/checkout@v4

      - name: Preflight laptop RAM before installing or exporting the model
        shell: powershell
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $totalGB = [math]::Round(([double]$computer.TotalPhysicalMemory) / 1GB, 1)
          $freeGB = [math]::Round(([double]$os.FreePhysicalMemory * 1KB) / 1GB, 1)
          $commit = Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory
          $commitGB = [math]::Round(([double]$commit.CommittedBytes) / 1GB, 1)
          $commitLimitGB = [math]::Round(([double]$commit.CommitLimit) / 1GB, 1)
          Write-Host "Detected physical RAM: $totalGB GB"
          Write-Host "Currently available physical RAM: $freeGB GB"
          Write-Host "Committed memory: $commitGB GB / $commitLimitGB GB"
          Write-Host "Top memory-consuming processes:"
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 12 ProcessName, Id, @{Name='RAM_GB';Expression={[math]::Round($_.WorkingSet64 / 1GB, 2)}} | Format-Table -AutoSize
          if ($totalGB -lt 14) {
            throw "This workflow is configured for a 16 GB-class laptop. Less than 14 GB physical RAM detected; stopping before model download/export."
          }
          if ($freeGB -lt 8) {
            throw "Only $freeGB GB RAM is currently available. Close memory-heavy apps and rerun; the LTX exporter needs substantial working memory."
          }


      - name: Install isolated OpenVINO environment with compatible Transformers
        id: install
        shell: powershell
        run: |
          $venv = $env:OPENVINO_LTX_VENV
          if (-not (Test-Path (Join-Path $venv "Scripts\python.exe"))) {
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $py = Join-Path $venv "Scripts\python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --upgrade-strategy eager openvino-genai optimum-intel "transformers<5" "diffusers==0.35.1" numpy accelerate sentencepiece protobuf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --upgrade hf_xet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import transformers, diffusers, openvino_genai, hf_xet, accelerate, sentencepiece; print('transformers', transformers.__version__); print('diffusers', diffusers.__version__); print('accelerate', accelerate.__version__); print('sentencepiece', sentencepiece.__version__); print('hf_xet import OK'); print('OpenVINO GenAI import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Hugging Face network access
        shell: powershell
        run: |
          $hosts = @("huggingface.co", "us.aws.cdn.hf.co")
          foreach ($hostName in $hosts) {
            $resolved = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Resolve-DnsName $hostName -ErrorAction Stop | Out-Null
                Write-Host "DNS OK: $hostName"
                $resolved = $true
                break
              } catch {
                Write-Warning "DNS attempt $attempt/5 failed for $hostName"
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            if (-not $resolved) {
              throw "Cannot resolve $hostName. Check this PC's internet/DNS connection, VPN, proxy, or firewall, then rerun."
            }
          }

          $workRoot = [System.IO.Path]::GetPathRoot($env:OPENVINO_MODEL_STORAGE_ROOT)
          $workDriveId = $workRoot.TrimEnd('\')
          $workVolume = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$workDriveId'"
          $cacheRoot = [System.IO.Path]::GetPathRoot($env:HF_HOME)
          $cacheDriveId = $cacheRoot.TrimEnd('\')
          $cacheVolume = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$cacheDriveId'"
          $workFreeGB = [math]::Round(([int64]$workVolume.FreeSpace) / 1GB, 1)
          $cacheFreeGB = [math]::Round(([int64]$cacheVolume.FreeSpace) / 1GB, 1)
          Write-Host "Free space on OpenVINO work drive: $workFreeGB GB ($workRoot)"
          Write-Host "Free space on Hugging Face cache drive: $cacheFreeGB GB ($cacheRoot)"
          if ([int64]$workVolume.FreeSpace -lt 30GB) {
            throw "Less than 30 GB remains on the OpenVINO work drive after environment setup."
          }
          if ([int64]$cacheVolume.FreeSpace -lt 35GB) {
            throw "Less than 35 GB remains on the Hugging Face cache drive."
          }

      - name: Export INT8 LTX-Video model (single attempt; avoid repeating an out-of-memory export)
        id: model
        timeout-minutes: 300
        shell: powershell
        run: |
          $modelDir = Join-Path $env:OPENVINO_MODEL_STORAGE_ROOT "ltx_video_openvino_int8"
          $cli = Join-Path $env:OPENVINO_LTX_VENV "Scripts\optimum-cli.exe"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          Write-Host "Exporting the OpenVINO-supported LTX text-to-video pipeline once."
          Write-Warning "The low-memory generation profile does not reduce peak RAM required during model export."
          & $cli export openvino --model Lightricks/LTX-Video --task text-to-video --trust-remote-code --weight-format int8 $modelDir
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $modelDir "model_index.json"))) {
            throw "LTX export failed. Inspect whether the failure is RAM exhaustion or an unsupported model/config. This 16 GB Iris Xe laptop may not be able to export the default checkpoint."
          }
          "OPENVINO_LTX_MODEL_DIR=$modelDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate AI video review clip
        shell: powershell
        env:
          PROMPT: ${{ inputs.prompt }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
        run: |
          $py = Join-Path $env:OPENVINO_LTX_VENV "Scripts\python.exe"
          & $py scripts/generate_openvino_video.py --prompt "$env:PROMPT" --aspect-ratio "$env:ASPECT_RATIO" --output "output/openvino_ltx_review.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvino-ltx-ai-video-review
          path: |
            output/openvino_ltx_review.mp4
            output/openvino_ltx_review.mp4.source.json
          if-no-files-found: error
          retention-days: 7
