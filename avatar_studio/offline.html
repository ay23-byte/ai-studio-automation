<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Studio · Offline presenter renderer</title>
  <style>
    html,body{margin:0;background:#0b1020;overflow:hidden}
    #stage{width:1280px;height:720px}
    #stage canvas{display:block;width:100%;height:100%}
  </style>
  <!--
    Offline (not real-time) presenter rendering.

    The live studio (index.html) records the canvas while the narration plays.
    On a CPU-only runner the software WebGL renderer cannot keep up, so that
    recording holds a fraction of the frames it should. Here nothing runs in
    real time: the page clock is replaced by a virtual clock that the driver
    (render-offline.mjs) advances by exactly one frame at a time. Every frame is
    rendered however long it takes, and frame k shows the mouth for narration
    time k / fps, so picture and sound are aligned by construction.
  -->
  <script>
    (() => {
      // Start above zero: the SDK treats a zero timestamp as "no timestamp".
      let now = 1000;
      const queue = new Map();
      let nextId = 1;
      window.__clock = {
        now: () => now,
        set(ms) { now = ms; },
        // Run exactly one animation frame at the current virtual time.
        frame() {
          const callbacks = [...queue.values()];
          queue.clear();
          for (const callback of callbacks) callback(now);
        },
      };
      performance.now = () => now;
      window.requestAnimationFrame = callback => { const id = nextId++; queue.set(id, callback); return id; };
      window.cancelAnimationFrame = id => { queue.delete(id); };
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      Object.defineProperty(AudioContextClass.prototype, "currentTime", { get() { return now / 1000; } });
      AudioContextClass.prototype.getOutputTimestamp = () => ({ contextTime: now / 1000, performanceTime: now });
      // The narration is never played here; the driver adds the original audio file to the video.
      // The requested start time is the virtual time at which narration sample 0 is "heard".
      AudioBufferSourceNode.prototype.start = function (when) { window.__speechStartSeconds = Number(when || 0); };
      // Reproducible blinks and idle motion: the same narration renders the same clip.
      let seed = 0x9e3779b9;
      window.__seed = value => { seed = (value >>> 0) || 0x9e3779b9; };
      Math.random = () => {
        seed = (seed + 0x6d2b79f5) >>> 0;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
  </script>
  <script type="importmap">
    {"imports":{
      "three":"/vendor/three/build/three.module.js",
      "three/examples/jsm/":"/vendor/three/examples/jsm/",
      "@interviewflowai/talking-avatar":"/vendor/talking-avatar/dist/index.js"
    }}
  </script>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import * as THREE from "three";
  import { TalkingAvatar } from "@interviewflowai/talking-avatar";

  const stage = document.getElementById("stage");
  const state = { avatar: null, renderer: null, bones: {}, rest: {}, envelope: null, fps: 30, speechStartMs: 0, mouth: null };

  // A soft studio backdrop drawn once: dark blue gradient, a warm light pool behind the
  // presenter and a vignette. Drawn in code so no image asset or licence is involved.
  function studioBackdrop(width, height) {
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const g = canvas.getContext("2d");
    const base = g.createLinearGradient(0, 0, 0, height);
    base.addColorStop(0, "#1b2740"); base.addColorStop(0.55, "#131c30"); base.addColorStop(1, "#0a0f1c");
    g.fillStyle = base; g.fillRect(0, 0, width, height);
    const pool = g.createRadialGradient(width * 0.5, height * 0.42, 0, width * 0.5, height * 0.42, width * 0.42);
    pool.addColorStop(0, "rgba(120,150,205,0.38)"); pool.addColorStop(0.5, "rgba(70,95,150,0.16)"); pool.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = pool; g.fillRect(0, 0, width, height);
    const warm = g.createRadialGradient(width * 0.82, height * 0.2, 0, width * 0.82, height * 0.2, width * 0.3);
    warm.addColorStop(0, "rgba(213,168,75,0.16)"); warm.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = warm; g.fillRect(0, 0, width, height);
    const vignette = g.createRadialGradient(width / 2, height / 2, height * 0.35, width / 2, height / 2, width * 0.72);
    vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,0.55)");
    g.fillStyle = vignette; g.fillRect(0, 0, width, height);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  function findBone(model, patterns) {
    let found = null;
    model.traverse(node => {
      if (found || !node.isBone) return;
      const name = node.name.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (patterns.some(pattern => name.endsWith(pattern))) found = node;
    });
    return found;
  }

  // The avatars ship in a modelling pose with the arms held away from the body. Bring the
  // upper arms down to a relaxed standing pose and bend the elbows slightly. Directions are
  // measured in world space on the loaded rig, so no bone-axis convention is assumed.
  function relaxArms(model) {
    const posed = [];
    const aim = (bone, child, target) => {
      model.updateMatrixWorld(true);
      const from = bone.getWorldPosition(new THREE.Vector3());
      const current = child.getWorldPosition(new THREE.Vector3()).sub(from).normalize();
      const swing = new THREE.Quaternion().setFromUnitVectors(current, target.clone().normalize());
      const world = swing.multiply(bone.getWorldQuaternion(new THREE.Quaternion()));
      const parent = bone.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
      bone.quaternion.copy(parent.multiply(world));
      posed.push(bone.name);
    };
    for (const side of ["l", "r"]) {
      const upper = findBone(model, [side + "upperarm", side === "l" ? "leftarm" : "rightarm"]);
      const fore = findBone(model, [side + "forearm", side === "l" ? "leftforearm" : "rightforearm"]);
      const hand = findBone(model, [side + "hand", side === "l" ? "lefthand" : "righthand"]);
      if (!upper || !fore) continue;
      model.updateMatrixWorld(true);
      // Which side of the body this arm is on, read from the rig rather than from its name.
      const outward = Math.sign(fore.getWorldPosition(new THREE.Vector3()).x - upper.getWorldPosition(new THREE.Vector3()).x) || 1;
      aim(upper, fore, new THREE.Vector3(outward * 0.16, -1, 0.04));
      if (hand) aim(fore, hand, new THREE.Vector3(outward * 0.05, -1, 0.22));
    }
    model.updateMatrixWorld(true);
    return posed;
  }

  // Head-and-shoulders framing for a 16:9 picture. The SDK frames only the face.
  function frameShot(renderer, framing) {
    const { camera, face } = renderer;
    const span = framing === "close" ? 0.42 : 0.54;            // picture height in metres at the face
    const distance = span / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.set(face.x, face.y + 0.02, face.z + distance);
    camera.lookAt(face.x, face.y - span * 0.13, face.z);
    camera.updateProjectionMatrix();
  }

  // Idle and speech-driven movement of the neck, head and upper spine, applied before every
  // render. Slow drift comes from sine waves with unrelated periods; emphasis comes from the
  // narration's own loudness, so the head moves with the voice and settles in pauses.
  function applyBodyMotion(seconds, speechSeconds) {
    const { bones, rest, envelope, fps } = state;
    const frame = Math.max(0, Math.round(speechSeconds * fps));
    const level = envelope && speechSeconds >= 0 ? (envelope[Math.min(frame, envelope.length - 1)] || 0) : 0;
    state.energy = (state.energy ?? 0) + (level - (state.energy ?? 0)) * 0.12;
    const energy = state.energy;
    const sway = Math.sin(seconds * 0.47) * 0.5 + Math.sin(seconds * 0.83 + 1.3) * 0.3 + Math.sin(seconds * 1.31 + 0.4) * 0.2;
    const nod = Math.sin(seconds * 0.61 + 0.7) * 0.5 + Math.sin(seconds * 1.07 + 2.1) * 0.3;
    const tilt = Math.sin(seconds * 0.39 + 2.4) * 0.6 + Math.sin(seconds * 0.97) * 0.25;
    const apply = (bone, key, x, y, z) => {
      if (!bone) return;
      bone.quaternion.copy(rest[key]).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z, "XYZ")));
    };
    const axes = state.axes;
    const turn = (yaw, pitch, roll) => {
      const euler = [0, 0, 0];
      euler[axes.yaw.index] = yaw * axes.yaw.sign;
      euler[axes.pitch.index] = pitch * axes.pitch.sign;
      euler[axes.roll.index] = roll * axes.roll.sign;
      return euler;
    };
    apply(bones.head, "head", ...turn(sway * 0.055, nod * 0.022 + energy * 0.05, tilt * 0.02));
    apply(bones.neck, "neck", ...turn(sway * 0.03, nod * 0.012 + energy * 0.02, tilt * 0.012));
    apply(bones.spine, "spine", ...turn(sway * 0.012, Math.sin(seconds * 1.9) * 0.004, tilt * 0.006));
  }

  // Which local axis of the head bone turns the head left-right, up-down and sideways.
  // Rig conventions differ, so it is measured on the loaded model instead of assumed.
  function measureAxes(model, head) {
    const forward = new THREE.Vector3(0, 0, 1), up = new THREE.Vector3(0, 1, 0);
    const restQuaternion = head.quaternion.clone();
    const probe = new THREE.Object3D();
    head.add(probe);
    const worldDirection = local => {
      probe.position.copy(local); model.updateMatrixWorld(true);
      const tip = probe.getWorldPosition(new THREE.Vector3());
      probe.position.set(0, 0, 0); model.updateMatrixWorld(true);
      return tip.sub(probe.getWorldPosition(new THREE.Vector3())).normalize();
    };
    // Local vectors that point to world-forward and world-up at rest.
    model.updateMatrixWorld(true);
    const inverse = head.getWorldQuaternion(new THREE.Quaternion()).invert();
    const localForward = forward.clone().applyQuaternion(inverse), localUp = up.clone().applyQuaternion(inverse);
    const result = {};
    const effects = [0, 1, 2].map(index => {
      const euler = [0, 0, 0]; euler[index] = 0.2;
      head.quaternion.copy(restQuaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(...euler, "XYZ")));
      const f = worldDirection(localForward), u = worldDirection(localUp);
      return { index, yaw: f.x, pitch: -f.y, roll: u.x };
    });
    head.quaternion.copy(restQuaternion); head.remove(probe); model.updateMatrixWorld(true);
    const taken = new Set();
    for (const motion of ["yaw", "pitch", "roll"]) {
      const best = effects.filter(effect => !taken.has(effect.index)).sort((a, b) => Math.abs(b[motion]) - Math.abs(a[motion]))[0];
      taken.add(best.index);
      result[motion] = { index: best.index, sign: Math.sign(best[motion]) || 1 };
    }
    return result;
  }

  // Normalised screen rectangle that contains the mouth, written to the clip's metadata so
  // the quality check can measure mouth movement in the finished video. It is the on-screen
  // extent of the vertices that the mouth shapes actually move, read from the loaded model.
  function mouthBox(renderer) {
    const { camera, model } = renderer;
    model.updateMatrixWorld(true); camera.updateMatrixWorld(true);
    let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity, used = 0, furthest = 0;
    const point = new THREE.Vector3(), reaches = [];
    // The mouth shapes are listed on every part of the model (suit, hair, eyes) but move
    // only the face, so the largest movement is taken across all parts.
    for (const mesh of renderer.faceMeshes) {
      const morphs = mesh.geometry.morphAttributes?.position, names = mesh.morphTargetDictionary || {};
      const slots = morphs ? Object.entries(names).filter(([name]) => name !== "viseme_sil" && /^viseme_|^jawOpen$/.test(name)).map(([, slot]) => slot) : [];
      if (!slots.length) continue;
      const total = mesh.geometry.attributes.position.count, reach = new Float32Array(total);
      for (const slot of slots) {
        const delta = morphs[slot];
        for (let index = 0; index < total; index++) {
          const size = Math.hypot(delta.getX(index), delta.getY(index), delta.getZ(index));
          if (size > reach[index]) reach[index] = size;
          if (size > furthest) furthest = size;
        }
      }
      reaches.push([mesh, reach]);
    }
    if (furthest <= 0) return null;
    for (const [mesh, reach] of reaches) {
      for (let index = 0; index < reach.length; index++) {
        if (reach[index] < furthest * 0.25) continue;
        mesh.getVertexPosition(index, point).applyMatrix4(mesh.matrixWorld).project(camera);
        const x = (point.x + 1) / 2, y = (1 - point.y) / 2;
        left = Math.min(left, x); right = Math.max(right, x); top = Math.min(top, y); bottom = Math.max(bottom, y); used++;
      }
    }
    if (!used) return null;
    // A margin for head movement during the clip.
    const padX = (right - left) * 0.3, padY = (bottom - top) * 0.3;
    const clamp = value => Math.min(1, Math.max(0, value));
    const box = { x: clamp(left - padX), y: clamp(top - padY) };
    box.width = clamp(right + padX) - box.x; box.height = clamp(bottom + padY) - box.y;
    return box;
  }

  window.studio = {
    state,
    async load({ gender = "male", width = 1280, height = 720, framing = "medium", seed = 1 } = {}) {
      stage.style.width = width + "px"; stage.style.height = height + "px";
      window.__seed(seed);
      const base = "/vendor/talking-avatar/dist/";
      const errors = [];
      const avatar = new TalkingAvatar({
        container: stage,
        avatarUrl: base + "avatars/" + (gender === "female" ? "female.glb" : "male.glb"),
        modelUrl: base + "viseme-model.bin",
        onError: error => errors.push(String(error?.message || error)),
      });
      await avatar.ready;
      const renderer = avatar.renderer;
      renderer.resize();
      renderer.scene.background = studioBackdrop(width, height);
      frameShot(renderer, framing);
      const model = renderer.model;
      const bones = {
        head: findBone(model, ["head"]),
        neck: findBone(model, ["neck", "neck1"]),
        spine: findBone(model, ["spine2", "spine1", "spine"]),
      };
      const arms = relaxArms(model);
      const rest = {};
      for (const [key, bone] of Object.entries(bones)) if (bone) rest[key] = bone.quaternion.clone();
      Object.assign(state, { avatar, renderer, bones, rest, errors, energy: 0 });
      state.axes = bones.head ? measureAxes(model, bones.head) : null;
      state.mouth = mouthBox(renderer);
      // Body motion is applied at the start of every SDK frame, before it renders.
      const readFrame = renderer.getFrame;
      renderer.getFrame = () => {
        if (state.axes) applyBodyMotion(window.__clock.now() / 1000, (window.__clock.now() - state.speechStartMs) / 1000);
        return readFrame();
      };
      return {
        canvas: [renderer.renderer.domElement.width, renderer.renderer.domElement.height],
        bones: Object.fromEntries(Object.entries(bones).map(([key, bone]) => [key, bone ? bone.name : null])),
        morphTargets: renderer.faceMeshes.reduce((total, mesh) => total + Object.keys(mesh.morphTargetDictionary || {}).length, 0),
        mouth: state.mouth,
        arms,
        webgl: (() => { const gl = renderer.renderer.getContext(); const info = gl.getExtension("WEBGL_debug_renderer_info"); return info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : "unknown"; })(),
      };
    },

    // Analyse the narration (the SDK's lip-sync model reads the whole clip first) and fix
    // the virtual time at which the first narration sample is heard.
    async prepare({ audioBase64, fps = 30, envelope = [] }) {
      const bytes = Uint8Array.from(atob(audioBase64), character => character.charCodeAt(0));
      state.fps = fps;
      state.envelope = envelope;
      window.__speechStartSeconds = undefined;
      state.avatar.speak(bytes.buffer).catch(error => state.errors.push(String(error?.message || error)));
      const deadline = Date.now() + 120000;
      while (window.__speechStartSeconds === undefined) {
        if (state.errors.length) throw new Error(state.errors.join("; "));
        if (Date.now() > deadline) throw new Error("Narration analysis did not finish within 120 seconds.");
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      state.speechStartMs = window.__speechStartSeconds * 1000;
      // Settle the smoothing filters on a few frames before narration time zero.
      for (let lead = 12; lead >= 1; lead--) {
        window.__clock.set(state.speechStartMs - lead * 1000 / fps);
        window.__clock.frame();
      }
      return { visemeEvents: state.avatar.events.length, speechStartMs: state.speechStartMs };
    },

    // Render frames [first, first + count) and return them as JPEG data URLs, with the
    // mouth opening the renderer applied on each frame (used only for the quality report).
    frames(first, count, quality = 0.92) {
      const canvas = state.renderer.renderer.domElement;
      const images = [], mouth = [];
      for (let index = first; index < first + count; index++) {
        window.__clock.set(state.speechStartMs + index * 1000 / state.fps);
        window.__clock.frame();
        images.push(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
        // Strongest mouth shape applied on this frame (0 = closed and at rest).
        let shape = 0;
        for (const mesh of state.renderer.faceMeshes) {
          for (const [name, slot] of Object.entries(mesh.morphTargetDictionary || {})) {
            if (name === "viseme_sil" || !/^viseme_|^jawOpen$/.test(name)) continue;
            shape = Math.max(shape, mesh.morphTargetInfluences[slot] || 0);
          }
        }
        mouth.push(Math.round(shape * 1000) / 1000);
      }
      return { images, mouth, errors: state.errors.splice(0) };
    },
  };
  window.studioReady = true;
</script>
</body>
</html>
